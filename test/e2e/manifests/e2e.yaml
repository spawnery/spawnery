# The manifest the driven run works on. Not config/samples/network.yaml -- that
# one is a realistic starting point for a user and should stay one; this one is
# bent to fit a test run, and says where.
#
# The images are deliberately unresolvable. Since milestone 6a publishes Paper
# and Velocity to a public registry, naming a real tag here would make the
# kubelet pull 724 MB into a fresh kind node on every run and start actual
# servers -- which is milestone 6a's declared non-goal (spec §1.4, §7.4). Pods
# staying in ErrImagePull is a decision, and this is where it is taken.
apiVersion: v1
kind: Namespace
metadata:
  name: minecraft
---
apiVersion: v1
kind: Secret
metadata:
  name: velocity-forwarding-secret
  namespace: minecraft
stringData:
  secret: e2e-forwarding-secret
---
apiVersion: spawnery.cloud/v1alpha1
kind: Network
metadata:
  name: production
  namespace: minecraft
spec:
  forwardingSecretRef:
    name: velocity-forwarding-secret
  defaults:
    minecraftVersion: "26.2"
---
apiVersion: spawnery.cloud/v1alpha1
kind: ServerGroup
metadata:
  name: lobby
  namespace: minecraft
spec:
  networkRef:
    name: production
  type: Ephemeral
  image: ghcr.io/spawnery/paper:e2e-no-such-tag
  maxPlayers: 100
  # Short, so scenario 6 -- Failed, then the corpse cleared -- closes inside a
  # single run rather than an hour.
  failedRetentionSeconds: 30
  drain:
    timeoutSeconds: 30
  scaling:
    minReplicas: 2
    maxReplicas: 4
    spareSlots: 10
---
apiVersion: spawnery.cloud/v1alpha1
kind: ServerGroup
metadata:
  name: survival
  namespace: minecraft
spec:
  networkRef:
    name: production
  type: Persistent
  image: ghcr.io/spawnery/paper:e2e-no-such-tag
  maxPlayers: 20
  replicas: 2
  drain:
    timeoutSeconds: 30
  storage:
    # kind's default class is rancher.io/local-path with
    # volumeBindingMode: WaitForFirstConsumer, which binds on the first pod
    # *scheduled* to consume the claim, not the first pod that actually
    # *runs*. These pods are scheduled -- kind's single control-plane node has
    # nothing stopping that -- and only then get stuck in ImagePullBackOff, so
    # the claims measurably reach Bound during this run, not Pending. (An
    # earlier version of this comment claimed Pending on the WaitForFirstConsumer
    # reasoning alone, without having checked what the pods actually do;
    # task-7-report.md's fix-round-1 section has the kubectl output that
    # caught it.) Either way is fine for this scenario: it is about the
    # claim's existence, its missing owner reference and its survival, none of
    # which needs a particular binding state. BuildDataClaim itself declines
    # to wait for Bound, for the same reason.
    size: 1Gi
---
apiVersion: spawnery.cloud/v1alpha1
kind: ProxyGroup
metadata:
  name: gateway
  namespace: minecraft
spec:
  networkRef:
    name: production
  replicas: 1
  image: ghcr.io/spawnery/velocity:e2e-no-such-tag
  expose:
    type: NodePort
    nodePort:
      port: 30765
  routing:
    fallbackGroups:
      - lobby
  config:
    playerLimit: 100
    motd: "spawnery e2e"
---
# gateway-lb exercises the LoadBalancer branch. kind runs no load balancer
# controller, so status.loadBalancer stays empty until the test writes an
# ingress entry into it by hand. That is a test of the operator's read-back,
# and nothing here claims a load balancer was involved.
apiVersion: spawnery.cloud/v1alpha1
kind: ProxyGroup
metadata:
  name: gateway-lb
  namespace: minecraft
spec:
  networkRef:
    name: production
  replicas: 1
  image: ghcr.io/spawnery/velocity:e2e-no-such-tag
  expose:
    type: LoadBalancer
    loadBalancer:
      externalTrafficPolicy: Local
      annotations:
        metallb.universe.tf/address-pool: spawnery-e2e
  routing:
    fallbackGroups:
      - lobby
---
# gateway-host binds 25565 on the node. The cluster has one node, so its
# second replica is the surplus the scheduler cannot place -- which is the
# point: it is the likeliest HostPort mistake a user can make, and this run
# gets it for free.
apiVersion: spawnery.cloud/v1alpha1
kind: ProxyGroup
metadata:
  name: gateway-host
  namespace: minecraft
spec:
  networkRef:
    name: production
  replicas: 2
  image: ghcr.io/spawnery/velocity:e2e-no-such-tag
  expose:
    type: HostPort
    hostPort:
      port: 25565
  routing:
    fallbackGroups:
      - lobby
---
# gateway-switch starts as NodePort and is patched to HostPort by
# aSwitchToHostPortRemovesTheService. It is a group of its own rather than a
# mutation of `gateway`, because the scenario list is ordered and every later
# scenario would inherit the change. Its host port is 25566, not 25565:
# gateway-host's pod holds that one on the single node whether or not its
# container ever starts.
apiVersion: spawnery.cloud/v1alpha1
kind: ProxyGroup
metadata:
  name: gateway-switch
  namespace: minecraft
spec:
  networkRef:
    name: production
  replicas: 1
  image: ghcr.io/spawnery/velocity:e2e-no-such-tag
  expose:
    type: NodePort
    nodePort:
      port: 30766
  routing:
    fallbackGroups:
      - lobby
---
# gateway-clusterip exercises the strategy for a network something else
# publishes. Nothing in this harness stands in front of it -- the point is the
# Service's shape and the published address, both of which the operator owns
# and neither of which needs a real ingress to check.
apiVersion: spawnery.cloud/v1alpha1
kind: ProxyGroup
metadata:
  name: gateway-clusterip
  namespace: minecraft
spec:
  networkRef:
    name: production
  replicas: 1
  image: ghcr.io/spawnery/velocity:e2e-no-such-tag
  expose:
    type: ClusterIP
    clusterIP:
      address: mc.e2e.test
  routing:
    fallbackGroups:
      - lobby
---
apiVersion: v1
kind: Secret
metadata:
  name: velocity-forwarding-secret
  namespace: minecraft-baseline
stringData:
  secret: e2e-forwarding-secret
---
apiVersion: spawnery.cloud/v1alpha1
kind: Network
metadata:
  name: production
  namespace: minecraft-baseline
spec:
  forwardingSecretRef:
    name: velocity-forwarding-secret
  defaults:
    minecraftVersion: "26.2"
---
# The group whose pods the API server refuses. Pod Security baseline
# disallows host ports outright, so no pod of this group can ever be created,
# and the refusal is the only thing this run can observe being enforced by
# anything.
apiVersion: spawnery.cloud/v1alpha1
kind: ProxyGroup
metadata:
  name: gateway-forbidden
  namespace: minecraft-baseline
spec:
  networkRef:
    name: production
  replicas: 1
  image: ghcr.io/spawnery/velocity:e2e-no-such-tag
  expose:
    type: HostPort
    # Not 25565. minecraft-baseline is a different namespace from minecraft,
    # but the cluster has one node, and a host port is a node-wide resource
    # -- namespaces don't isolate it. Sharing 25565 with gateway-host would
    # mean that if Pod Security enforcement were ever weakened, this pod's
    # fate would be decided by a scheduler collision with gateway-host's pod
    # rather than by Pod Security, so this scenario would fail (if it failed
    # at all) for a reason that has nothing to do with what it exists to
    # measure. 25567 is unused by every other group in this manifest.
    hostPort:
      port: 25567
  routing:
    fallbackGroups:
      - lobby
