# The manifest of the world-sync run: ondemand.yaml's network, proxy and
# groups in another namespace, so the two runs never share an object, with the
# private-servers group keeping its world in the object store. Its game image
# is the real Purpur image, which hack/e2e-worldsync.sh builds and loads; the
# agent in it waits in the Paper bootstrapper for the world the node agent
# hands it.
apiVersion: v1
kind: Namespace
metadata:
  name: minecraft-ws
---
apiVersion: v1
kind: Secret
metadata:
  name: velocity-forwarding-secret
  namespace: minecraft-ws
stringData:
  secret: e2e-forwarding-secret
---
apiVersion: spawnery.cloud/v1alpha1
kind: Network
metadata:
  name: production
  namespace: minecraft-ws
spec:
  forwardingSecretRef:
    name: velocity-forwarding-secret
  defaults:
    minecraftVersion: "26.3"
    # docs/tutorial/network.yaml's own numbers, and they are load-bearing here
    # rather than decoration. The image sizes the heap with MaxRAMPercentage,
    # so a server with no memory limit takes three quarters of whatever machine
    # it lands on -- 70 GiB on the workstation this was written on, and more
    # than a GitHub runner has on the runner nightly.yml gives it.
    # The CPU request is below the tutorial's: every kind node reports all of
    # the host's CPUs, and on a 2-CPU host a worker that also runs MinIO and
    # the node agent has no full CPU left for the second start.
    resources:
      requests:
        cpu: 250m
        memory: 2Gi
      limits:
        memory: 2Gi
---
# The proxy this run asks on. Its image never resolves and that is enough: the
# test authenticates as this pod to open its session, and grpcauth checks the
# pod's UID and its managed-by and role labels, none of which needs a container
# that started. A real Velocity here would cost another image in the run and
# prove nothing further, because the plugin that would send the request is the
# consumer's and lives in another repository.
apiVersion: spawnery.cloud/v1alpha1
kind: ProxyGroup
metadata:
  name: gateway
  namespace: minecraft-ws
spec:
  networkRef:
    name: production
  replicas: 1
  image: ghcr.io/spawnery/velocity:e2e-no-such-tag
  expose:
    type: ClusterIP
    clusterIP:
      address: mc.e2e.test
  routing:
    # A lobby rather than private-servers: a proxy's fallback list is where
    # players land when they have nowhere else to go, and a group of private
    # worlds is the one thing that must never be that. The list may not be
    # empty, so the group below exists to be named here.
    fallbackGroups:
      - lobby
---
# Named by the proxy's fallback list and nothing else. minReplicas 0 with no
# spare slots keeps it at zero servers: a server here could never start -- its
# image does not resolve -- and each one that tried would spend the run cycling
# through Failed and leaving denial-shaped noise in the log this package reads.
apiVersion: spawnery.cloud/v1alpha1
kind: ServerGroup
metadata:
  name: lobby
  namespace: minecraft-ws
spec:
  networkRef:
    name: production
  type: Ephemeral
  image: ghcr.io/spawnery/paper:e2e-no-such-tag
  maxPlayers: 20
  scaling:
    minReplicas: 0
    maxReplicas: 1
    spareSlots: 0
---
apiVersion: spawnery.cloud/v1alpha1
kind: ServerGroup
metadata:
  name: private-servers
  namespace: minecraft-ws
spec:
  networkRef:
    name: production
  type: OnDemand
  image: ghcr.io/spawnery/purpur:26.3-0.24.1
  maxPlayers: 10
  maxInstances: 4
  storage:
    # Ignored under ObjectStore, but required by the schema.
    size: 1Gi
    backend: ObjectStore
    keep:
      - world
