apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docs
  annotations:
    # external-dns runs with an explicit --annotation-prefix; the alpha form
    # is silently ignored. The target follows node health.
    external-dns.kubernetes.io/target: ingress.paul.wtf
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - docs.spawnery.cloud
      secretName: docs-tls
  rules:
    - host: docs.spawnery.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: docs
                port:
                  number: 80
