name: Nightly

on:
  schedule:
    # Off the hour, when every other repository's cron fires.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  image-repro:
    runs-on: ubuntu-latest
    # Images built twice and compared for a bit-identical rebuild.
    timeout-minutes: 90
    env:
      # hack/require-no-red-nightly.sh hardcodes the same string; change both.
      NIGHTLY_LABEL: nightly-red
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            # The default ten lines end inside Gradle's eight-line "Try:" block,
            # before the failing test's name.
            log-lines = 40
      - name: make image-repro
        run: nix develop -c make image-repro

      # A red nightly opens an issue, which hack/require-no-red-nightly.sh
      # refuses to release over. failure() is false for a cancelled run.
      - name: Report the failure where somebody will meet it
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # gh issue create refuses a label that does not exist yet.
          gh label create "${NIGHTLY_LABEL}" \
            --color b60205 \
            --description "The nightly reproducibility build is failing. Closing this is how you say the cause is fixed." \
            2>/dev/null || true

          existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" \
            --label "${NIGHTLY_LABEL}" --state open --json number --limit 1 \
            --jq '.[0].number // empty')"

          cat >/tmp/nightly-body.md <<EOF
          \`make image-repro\` failed on the nightly run.

          | | |
          |---|---|
          | latest failing run | ${RUN_URL} |
          | commit | \`${GITHUB_SHA}\` |
          | last updated | $(date -u '+%Y-%m-%dT%H:%M:%SZ') |

          This job builds \`.#purpur-image\`, \`.#velocity-image\`,
          \`.#operator-image\` and \`.#agents\`, each twice, and compares. It is
          the only job in this repository that builds the Purpur and Velocity
          images at all — \`ci.yml\`'s \`e2e\` job builds
          \`.#operator-image\` and nothing else — so a stale fixed-output hash
          in \`nix/paper.nix\` or \`nix/velocity.nix\` is visible here and
          nowhere else until \`hack/publish.sh\` meets it on a runner, after a
          tag has been pushed and the release has already been announced.

          **\`hack/require-no-red-nightly.sh\` refuses a release while this
          issue is open.** Closing it is the whole override, and closing it is
          a claim that the cause is fixed. If the claim is wrong, tomorrow's
          nightly opens a new one and the release after that stops again.

          Opened automatically by \`.github/workflows/nightly.yml\`.
          EOF

          if [ -n "${existing}" ]; then
            # Edited, not commented on: one issue rather than a notification a night.
            gh issue edit "${existing}" --repo "${GITHUB_REPOSITORY}" \
              --body-file /tmp/nightly-body.md
            echo "::notice::updated ${GITHUB_REPOSITORY}#${existing}, which was already open"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" \
              --title "Nightly: make image-repro failed" \
              --label "${NIGHTLY_LABEL}" \
              --body-file /tmp/nightly-body.md
          fi

      - name: Close the report if there is one
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # A missing label is an error, read here as "nothing to close"; the
          # release gate reads the same failure the other way, on purpose.
          existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" \
            --label "${NIGHTLY_LABEL}" --state open --json number --limit 1 \
            --jq '.[0].number // empty' 2>/dev/null || true)"

          if [ -z "${existing}" ]; then
            exit 0
          fi

          gh issue close "${existing}" --repo "${GITHUB_REPOSITORY}" \
            --comment "Closed by the nightly run that passed: ${RUN_URL}"
          echo "::notice::closed ${GITHUB_REPOSITORY}#${existing}"

  # The tutorial path with real game images, too heavy for every push.
  # nightly-tutorial-red deliberately gates no release: a broken tutorial is
  # fixed in the docs, not by holding a tag.
  tutorial-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NIGHTLY_LABEL: nightly-tutorial-red
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: make e2e-tutorial
        run: nix develop -c make e2e-tutorial

      - name: Report the failure where somebody will meet it
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          gh label create "${NIGHTLY_LABEL}" \
            --color b60205 \
            --description "The tutorial's own end-to-end path (hack/e2e-tutorial.sh) is failing. Closing this is how you say the cause is fixed." \
            2>/dev/null || true

          existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" \
            --label "${NIGHTLY_LABEL}" --state open --json number --limit 1 \
            --jq '.[0].number // empty')"

          cat >/tmp/nightly-tutorial-body.md <<EOF
          \`make e2e-tutorial\` failed on the nightly run.

          | | |
          |---|---|
          | latest failing run | ${RUN_URL} |
          | commit | \`${GITHUB_SHA}\` |
          | last updated | $(date -u '+%Y-%m-%dT%H:%M:%SZ') |

          This job builds and loads the real Purpur and Velocity images and
          drives \`test/e2e/tutorial_test.go\`'s \`TestTutorialPath\`: apply
          \`docs/tutorial/network.yaml\`, wait for a Ready backend and an
          addressable proxy, join with \`cmd/spawnery-join --hold\`, and check
          the proxy's \`status.connectedPlayers\`. It is the only thing in this
          repository that drives that join, so a regression here is invisible
          to \`ci.yml\`'s e2e job, which builds only \`.#operator-image\`.

          Opened automatically by \`.github/workflows/nightly.yml\`.
          EOF

          if [ -n "${existing}" ]; then
            gh issue edit "${existing}" --repo "${GITHUB_REPOSITORY}" \
              --body-file /tmp/nightly-tutorial-body.md
            echo "::notice::updated ${GITHUB_REPOSITORY}#${existing}, which was already open"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" \
              --title "Nightly: the tutorial's path failed" \
              --label "${NIGHTLY_LABEL}" \
              --body-file /tmp/nightly-tutorial-body.md
          fi

      - name: Close the report if there is one
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" \
            --label "${NIGHTLY_LABEL}" --state open --json number --limit 1 \
            --jq '.[0].number // empty' 2>/dev/null || true)"

          if [ -z "${existing}" ]; then
            exit 0
          fi

          gh issue close "${existing}" --repo "${GITHUB_REPOSITORY}" \
            --comment "Closed by the nightly run that passed: ${RUN_URL}"
          echo "::notice::closed ${GITHUB_REPOSITORY}#${existing}"

  # The on-demand path; ci.yml's e2e has no real game image, so nothing there
  # writes a world. Its label gates no release either.
  ondemand-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NIGHTLY_LABEL: nightly-ondemand-red
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: make e2e-ondemand
        run: nix develop -c make e2e-ondemand

      - name: Report the failure where somebody will meet it
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          gh label create "${NIGHTLY_LABEL}" \
            --color b60205 \
            --description "The on-demand end-to-end path (hack/e2e-ondemand.sh) is failing. Closing this is how you say the cause is fixed." \
            2>/dev/null || true

          existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" \
            --label "${NIGHTLY_LABEL}" --state open --json number --limit 1 \
            --jq '.[0].number // empty')"

          cat >/tmp/nightly-ondemand-body.md <<EOF
          \`make e2e-ondemand\` failed on the nightly run.

          | | |
          |---|---|
          | latest failing run | ${RUN_URL} |
          | commit | \`${GITHUB_SHA}\` |
          | last updated | $(date -u '+%Y-%m-%dT%H:%M:%SZ') |

          This job builds and loads the real Purpur image and drives
          \`test/e2e/ondemand_test.go\`'s
          \`TestAPrivateServersWorldOutlivesItsServer\`: ask for a private
          server over a real proxy agent session, write a marker into the world
          it generates, stop it, and find that marker in the pod of the next
          start. It is the only thing in this repository that shows a world
          outliving its server, so a regression here is invisible to every
          other suite -- the envtest ones read objects back and no object says
          whether a player's world is still there.

          Opened automatically by \`.github/workflows/nightly.yml\`.
          EOF

          if [ -n "${existing}" ]; then
            gh issue edit "${existing}" --repo "${GITHUB_REPOSITORY}" \
              --body-file /tmp/nightly-ondemand-body.md
            echo "::notice::updated ${GITHUB_REPOSITORY}#${existing}, which was already open"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" \
              --title "Nightly: a private server's world did not survive" \
              --label "${NIGHTLY_LABEL}" \
              --body-file /tmp/nightly-ondemand-body.md
          fi

      - name: Close the report if there is one
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" \
            --label "${NIGHTLY_LABEL}" --state open --json number --limit 1 \
            --jq '.[0].number // empty' 2>/dev/null || true)"

          if [ -z "${existing}" ]; then
            exit 0
          fi

          gh issue close "${existing}" --repo "${GITHUB_REPOSITORY}" \
            --comment "Closed by the nightly run that passed: ${RUN_URL}"
          echo "::notice::closed ${GITHUB_REPOSITORY}#${existing}"

  # The object-store world path: MinIO on a three-node kind cluster and the real
  # game image. Its label gates no release either.
  worldsync-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NIGHTLY_LABEL: nightly-worldsync-red
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: make e2e-worldsync
        run: nix develop -c make e2e-worldsync

      - name: Report the failure where somebody will meet it
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          gh label create "${NIGHTLY_LABEL}" \
            --color b60205 \
            --description "The object-store world end-to-end path (hack/e2e-worldsync.sh) is failing. Closing this is how you say the cause is fixed." \
            2>/dev/null || true

          existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" \
            --label "${NIGHTLY_LABEL}" --state open --json number --limit 1 \
            --jq '.[0].number // empty')"

          cat >/tmp/nightly-worldsync-body.md <<EOF
          \`make e2e-worldsync\` failed on the nightly run.

          | | |
          |---|---|
          | latest failing run | ${RUN_URL} |
          | commit | \`${GITHUB_SHA}\` |
          | last updated | $(date -u '+%Y-%m-%dT%H:%M:%SZ') |

          This job builds and loads the real Purpur image and the node agent,
          starts MinIO, and drives \`test/e2e/worldsync_test.go\`'s
          \`TestAnObjectStoreWorldTravelsBetweenNodes\`: start a private
          server whose world lives in the object store, write a marker into
          it, stop it, cordon its node, start it again on the other node and
          find the marker, then delete the member and wait for its prefix to
          empty. Nothing else in this repository runs the node agent against a
          store, so a regression here is invisible to every other suite.

          Opened automatically by \`.github/workflows/nightly.yml\`.
          EOF

          if [ -n "${existing}" ]; then
            gh issue edit "${existing}" --repo "${GITHUB_REPOSITORY}" \
              --body-file /tmp/nightly-worldsync-body.md
            echo "::notice::updated ${GITHUB_REPOSITORY}#${existing}, which was already open"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" \
              --title "Nightly: an object-store world did not travel" \
              --label "${NIGHTLY_LABEL}" \
              --body-file /tmp/nightly-worldsync-body.md
          fi

      - name: Close the report if there is one
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" \
            --label "${NIGHTLY_LABEL}" --state open --json number --limit 1 \
            --jq '.[0].number // empty' 2>/dev/null || true)"

          if [ -z "${existing}" ]; then
            exit 0
          fi

          gh issue close "${existing}" --repo "${GITHUB_REPOSITORY}" \
            --comment "Closed by the nightly run that passed: ${RUN_URL}"
          echo "::notice::closed ${GITHUB_REPOSITORY}#${existing}"
