name: Release

on:
  push:
    tags: ["v*"]
  # A dispatch can only dry-run: publishing is a decision a tag records.
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: read
  # issues: read only: closing a nightly report is the release owner's act.
  issues: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Refuses to publish unless ci.yml concluded success on this commit.
      - name: CI, on the commit this tag points at
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: hack/require-green-ci.sh "${GITHUB_REPOSITORY}" "${GITHUB_SHA}"

      # Reads an open issue rather than nightly.yml's last run: a run's verdict is
      # about its night, and a red one would block its own fix until the next one.
      - name: The nightly reproducibility build
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: hack/require-no-red-nightly.sh "${GITHUB_REPOSITORY}"

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # skopeo writes its credential under $XDG_RUNTIME_DIR, which hosted runners
      # leave unset, and its fallback /run/containers is not creatable by a non-root
      # runner. REGISTRY_AUTH_FILE names just this file and also reaches
      # hack/publish.sh's skopeo calls.
      - name: Where skopeo keeps its credential
        run: echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/auth.json" >> "$GITHUB_ENV"

      # The tag must name one of imageVersion, operatorVersion or the chart's
      # version; they move independently. .#agents.version and
      # .#spawnery-operator.version are the versions themselves, unlike the composed
      # imageTag attributes.
      - name: The tag, against the versions in flake.nix
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          agent="$(nix eval --raw .#agents.version)"
          operator="$(nix eval --raw .#spawnery-operator.version)"
          chart="$(grep -E '^version:' charts/spawnery/Chart.yaml | head -1 | awk '{print $2}')"
          if [ -z "$chart" ]; then
            echo "no version: line in charts/spawnery/Chart.yaml; this step reads it as text" >&2
            echo "and cannot check a tag against what it cannot find." >&2
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          echo "tag                       ${GITHUB_REF_NAME} (${tag})"
          echo "flake.nix imageVersion    ${agent}   (purpur, velocity)"
          echo "flake.nix operatorVersion ${operator}   (operator)"
          echo "Chart.yaml version        ${chart}   (chart)"
          echo "what this tag publishes:"
          purpur_tag="$(nix eval --raw .#purpur-image.imageTag)"
          velocity_tag="$(nix eval --raw .#velocity-image.imageTag)"
          operator_tag="$(nix eval --raw .#operator-image.imageTag)"
          echo "  purpur    ${purpur_tag}"
          echo "  velocity  ${velocity_tag}"
          echo "  operator  ${operator_tag}"
          echo "  chart     ${chart}"
          for pair in "paper:${paper_tag}" "velocity:${velocity_tag}"; do
            case "${pair#*:}" in
              *-"${agent}") ;;
              *)
                echo >&2
                echo "the ${pair%%:*} image is tagged ${pair#*:}, which does not end in the" >&2
                echo "imageVersion this step read (${agent}). The tag and the version have" >&2
                echo "come apart, so the check below would compare ${GITHUB_REF_NAME} against a" >&2
                echo "number no image carries. Fix nix/agents.nix or nix/${pair%%:*}-image.nix." >&2
                exit 1
                ;;
            esac
          done
          if [ "$operator_tag" != "$operator" ]; then
            echo >&2
            echo "the operator image is tagged ${operator_tag}, not the operatorVersion this" >&2
            echo "step read (${operator}). nix/operator-image.nix used to take the tag from" >&2
            echo "operatorVersion unchanged; if that is no longer true, this guard is" >&2
            echo "comparing ${GITHUB_REF_NAME} against a number no image carries." >&2
            exit 1
          fi
          if [ "$tag" != "$agent" ] && [ "$tag" != "$operator" ] && [ "$tag" != "$chart" ]; then
            echo >&2
            echo "${GITHUB_REF_NAME} names a version no artefact in this repository carries." >&2
            echo "A tag that corresponds to nothing anybody bumped is how a release goes out" >&2
            echo "under a number the things inside it do not have. Bump imageVersion or" >&2
            echo "operatorVersion in flake.nix, or version in charts/spawnery/Chart.yaml, to" >&2
            echo "match -- or tag one of the versions that is there." >&2
            exit 1
          fi

      # Flux names a packaged chart after Chart.yaml's version, so a chart that
      # moved without a version bump never reaches a cluster. Also decides whether
      # this tag has a chart to publish.
      - name: The chart's own version, against the previous tag
        id: chart_version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          previous="$(git tag --list 'v*' --sort=-version:refname \
            | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)"
          if [ -z "$previous" ]; then
            echo "no earlier v* tag; nothing to compare against"
            echo "chart_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "comparing charts/ against ${previous}"
          if git diff --quiet "${previous}" HEAD -- charts/; then
            echo "charts/ is unchanged since ${previous}; its version may stand"
            echo "chart_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "chart_changed=true" >> "$GITHUB_OUTPUT"
          now="$(grep -E '^version:' charts/spawnery/Chart.yaml | head -1 | awk '{print $2}')"
          before="$(git show "${previous}:charts/spawnery/Chart.yaml" \
            | grep -E '^version:' | head -1 | awk '{print $2}')"
          echo "charts/ changed since ${previous}"
          echo "  Chart.yaml version there: ${before}"
          echo "  Chart.yaml version here:  ${now}"
          if [ "$now" = "$before" ]; then
            echo >&2
            echo "charts/ changed since ${previous} but charts/spawnery/Chart.yaml still says" >&2
            echo "version: ${now}. Flux names a packaged chart after that number, so a cluster" >&2
            echo "pointed at ${GITHUB_REF_NAME} would keep serving the chart ${previous} produced --" >&2
            echo "old CRDs, old templates -- while everything else about the release looks" >&2
            echo "correct. Bump Chart.yaml's version." >&2
            exit 1
          fi

      - name: Authenticate skopeo to ghcr.io
        if: github.event_name == 'push'
        run: |
          nix develop -c skopeo login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"

      # One invocation per image: hack/publish.sh refuses at the first tag already
      # there (exit 3), and usually only one version moved. Nothing is overwritten.
      - name: hack/publish.sh, one image at a time
        id: publish
        run: |
          set -euo pipefail
          dry_run=0
          if [ "${{ github.event_name }}" != "push" ]; then
            dry_run=1
            echo "::notice::dispatched, not tagged: DRY_RUN=1, nothing is sent to the registry"
          fi
          published=0
          operator_published=false
          for image in purpur-image purpur-image-26-2 velocity-image operator-image; do
            status=0
            nix develop -c env DRY_RUN="$dry_run" WRITE_DIGEST=1 \
              ./hack/publish.sh "$image" || status=$?
            case "$status" in
              0)
                published=$(( published + 1 ))
                if [ "$image" = "operator-image" ]; then
                  operator_published=true
                fi
                ;;
              3)
                echo "::notice::${image} is already published at the version flake.nix names; skipping it"
                ;;
              *)
                exit "$status"
                ;;
            esac
          done
          echo "operator_published=${operator_published}" >> "$GITHUB_OUTPUT"
          # Publishing nothing is a mistake on the first attempt, and expected on a
          # re-run after a later step failed. Not if: always() on the later steps: that
          # would create a Release for a publish that genuinely failed.
          if [ "$dry_run" = "0" ] && [ "$published" -eq 0 ] \
            && [ "${{ steps.chart_version.outputs.chart_changed }}" != "true" ]; then
            if [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then
              echo "::notice::attempt ${GITHUB_RUN_ATTEMPT}: every image is already on the registry at the version flake.nix names, which is what a re-run of a tag that already published looks like. Carrying on to the digest and Release steps, which is what a re-run is for."
            else
              echo >&2
              echo "every image was already published at the version flake.nix names," >&2
              echo "and charts/ has not moved since the previous tag either, so" >&2
              echo "${GITHUB_REF_NAME} releases nothing. Bump imageVersion or operatorVersion in" >&2
              echo "flake.nix, or change the chart, and tag again." >&2
              exit 1
            fi
          fi

      # Emitted, not committed. Fails only when the operator image was pushed on
      # this tag; otherwise the chart's digest is already current.
      - name: Emit the digest
        id: digest
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          digest="$(grep -oE 'sha256:[0-9a-f]{64}' charts/spawnery/values.yaml || true)"
          if [ "${{ steps.publish.outputs.operator_published }}" != "true" ]; then
            echo "the operator image was already published at this version; charts/spawnery/values.yaml"
            echo "keeps the digest it already carries (${digest:-none})."
            # On a re-run the digest is only in the publishing attempt's log:
            # hack/publish.sh takes it from skopeo copy --digestfile.
            exit 0
          fi
          if [ -z "$digest" ]; then
            echo "publish.sh produced no digest in charts/spawnery/values.yaml" >&2
            exit 1
          fi
          echo "operator image digest: $digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # After the images, so a published chart never points at a missing image.
      - name: Authenticate helm to ghcr.io
        if: github.event_name == 'push'
        run: |
          nix develop -c helm registry login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"

      # Exit 3: this chart version is already on the registry, the usual case.
      - name: hack/publish-chart.sh
        id: publish_chart
        run: |
          set -euo pipefail
          dry_run=0
          if [ "${{ github.event_name }}" != "push" ]; then
            dry_run=1
            echo "::notice::dispatched, not tagged: DRY_RUN=1, no chart is sent to the registry"
          fi
          status=0
          nix develop -c env DRY_RUN="$dry_run" ./hack/publish-chart.sh || status=$?
          case "$status" in
            0)
              echo "chart_published=true" >> "$GITHUB_OUTPUT"
              ;;
            3)
              echo "::notice::the chart is already published at the version charts/spawnery/Chart.yaml names; skipping it"
              echo "chart_published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              exit "$status"
              ;;
          esac

      # Skipped rather than failed without credentials: they belong to a person,
      # and the other artefacts should not wait on them.
      - name: hack/publish-api.sh
        id: publish_api
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CENTRAL_USERNAME:-}" ] || [ -z "${SIGNING_KEY:-}" ]; then
            echo "::notice::no Central Portal credentials or signing key configured; the API jar is not published"
            echo "api_published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dry_run=0
          if [ "${{ github.event_name }}" != "push" ]; then
            dry_run=1
            echo "::notice::dispatched, not tagged: DRY_RUN=1, nothing is sent to Central"
          fi
          status=0
          nix develop -c env DRY_RUN="$dry_run" ./hack/publish-api.sh || status=$?
          case "$status" in
            0)
              echo "api_published=true" >> "$GITHUB_OUTPUT"
              ;;
            3)
              echo "::notice::that version of the API is already on Central; skipping it"
              echo "api_published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              exit "$status"
              ;;
          esac

      - name: The GitHub Release, carrying the digest
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          OPERATOR_PUBLISHED: ${{ steps.publish.outputs.operator_published }}
          CHART_PUBLISHED: ${{ steps.publish_chart.outputs.chart_published }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "Published by \`.github/workflows/release.yml\` from ${GITHUB_SHA}."
            echo
            if [ -n "${DIGEST:-}" ]; then
              echo "Operator image digest:"
              echo
              echo '```'
              echo "${DIGEST}"
              echo '```'
              echo
              echo "This workflow does not commit it, and the reason that step is a person's"
              echo "and not this job's is in the CI design's §5."
              echo
              echo "Put it where the deployment is described -- a HelmRelease's values, a"
              echo "kustomize patch -- and **not** into \`charts/spawnery/values.yaml\`'s"
              echo "\`image.digest\`, which this text told people to do until v0.1.2. A digest"
              echo "cannot usefully live in the chart: it comes from \`skopeo copy --digestfile\`"
              echo "and so does not exist until after the tag is published, which makes the"
              echo "value in any released chart the *previous* release's. Worse, setting it"
              echo "silences internal/rbacaudit's TestTheOperatorImageIsNotAMutableTag, which"
              echo "returns early when a digest is present and therefore stops checking the"
              echo "tag beside it."
            elif [ "${OPERATOR_PUBLISHED:-false}" != "true" ] && [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then
              echo "This is attempt ${GITHUB_RUN_ATTEMPT} of the run for this tag, and the operator image"
              echo "was already on the registry when it started -- so an earlier attempt published it"
              echo "and this one had nothing to push. The digest is not recoverable from this attempt:"
              echo "\`hack/publish.sh\` takes it from \`skopeo copy\`'s own \`--digestfile\`, which only"
              echo "the attempt that did the copying has. It is in that attempt's log, under"
              echo "\`published ghcr.io/spawnery/spawnery-operator\`."
            else
              echo "No new operator image on this tag: it was already published at the version"
              echo "\`flake.nix\` names, and \`charts/spawnery/values.yaml\`'s \`image.digest\` is"
              echo "unchanged."
            fi
            # The chart version, not the tag: the two numbers differ.
            chart_version="$(grep -E '^version:' charts/spawnery/Chart.yaml | head -1 | awk '{print $2}')"
            echo
            echo "## Install"
            echo
            echo '```bash'
            echo "helm install spawnery oci://ghcr.io/spawnery/charts/spawnery \\"
            echo "  --version ${chart_version} \\"
            echo "  --namespace spawnery-system --create-namespace"
            echo '```'
            echo
            if [ "${CHART_PUBLISHED:-false}" != "true" ]; then
              echo "That chart is not new on this tag -- \`charts/\` has not moved since the"
              echo "previous one, so version ${chart_version} is the artefact an earlier release"
              echo "already pushed, and it is the right one to install."
            fi
          } > "$notes"
          # Updated if present, so a re-run does not fail on its own earlier attempt.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$notes"
          fi
