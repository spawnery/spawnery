name: CI

on:
  push:
    branches: [master]
  pull_request:

# A second push to the same branch cancels the first: nothing here needs the
# older run's answer, and the runners are shared.
#
# Except on master, where the older run's answer is the only one that commit
# will ever get. Two merges minutes apart would have the first master run
# cancelled mid-e2e and never re-run, leaving a master commit with no green
# verdict -- and a v* tag cut on that commit publishing from a ref CI never
# finished. A pull request always gets another run when it is pushed again;
# a merged commit does not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # make test runs manifests, generate, fmt, vet and chart-lint before
    # go test -race across every package, several of which are envtest-backed
    # and start a real API server. Twenty-five minutes is about 4.7x what this
    # job has actually taken on a runner -- 5m19s on run 32334756738, the last
    # driven CI run of the milestone that added this file. It is deliberately
    # not sized against the local number instead (Makefile:58 records the race
    # suite at 89.8-109.2s): a timeout's job is to stop a wedged run, and the
    # machine it has to be generous to is the runner, whose cold Nix store and
    # shared CPU already put it at 3x local before anything goes wrong.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Timed on purpose. The store is cold on every hosted runner, and this
      # number is what decides whether a cache is worth its dependency --
      # see the design's §2.1.
      - name: Warm the dev shell
        run: |
          start=$(date +%s)
          nix develop -c true
          echo "dev shell ready in $(( $(date +%s) - start ))s"

      - name: make test
        run: nix develop -c make test

      # The deps job below has been guarding one generated file since this
      # workflow was written. Seven others had no guard at all, and the reason
      # is the same shape in each case: `make test` depends on `manifests
      # generate fmt`, so it *regenerates* them before it tests anything.
      # config/rbac/role.yaml, config/crd/bases/*.yaml and (via
      # hack/chart-templates.sh) charts/spawnery/templates/{rbac,crds}.yaml are
      # all rewritten in place, and `go fmt ./...` rewrites and exits 0. So a
      # contributor who adds a +kubebuilder:rbac marker and forgets `make
      # manifests` gets a green run: rbacaudit compares a freshly generated
      # role against the table and agrees, e2e helm installs a freshly
      # generated chart and passes, and the pull request merges with a stale
      # chart that installs an operator missing the grant. A formatting
      # violation could likewise never fail CI.
      #
      # The guard belongs here rather than in the Makefile. `make manifests`
      # regenerating for a developer mid-edit is the right behaviour and this
      # must not change it; what is wrong is only that nobody afterwards
      # compares the result with what is committed. This is one line and it is
      # the deps job's own lesson, applied to the other seven files.
      - name: the generated files are in step with their sources
        run: |
          set -euo pipefail
          if ! git diff --exit-code; then
            echo >&2
            echo "make test regenerated a tracked file and the result differs from what is" >&2
            echo "committed. Run 'make manifests generate fmt' and commit the diff above." >&2
            exit 1
          fi
          # git diff sees nothing when generation *adds* a file -- a new CRD,
          # for instance, which is exactly the change most likely to be
          # forgotten. cover.out is the only untracked file make test leaves,
          # and it is gitignored, so --exclude-standard makes this quiet.
          untracked="$(git ls-files --others --exclude-standard -- api config charts)"
          if [ -n "$untracked" ]; then
            echo "make test generated a file that is not committed:" >&2
            echo "$untracked" >&2
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: make lint
        run: nix develop -c make lint

  # The Paper and Velocity images, built only when something that defines them
  # moved.
  #
  # docs/known-issues.md, "From milestone 6e (CI)": this workflow builds one of
  # the three image derivations the release publishes. The e2e job runs
  # `nix build .#operator-image` and that is the only image any job here
  # reaches, so nix/paper.nix's two fixed-output hashes and nix/velocity.nix's
  # third are fetched against by nothing on the commit loop. Move one and the
  # first thing to notice is hack/publish.sh on a runner, after a v* tag has
  # been pushed and the release has therefore already been announced.
  #
  # That entry weighed building all three on every push -- minutes of runner
  # time on every commit for derivations that change a handful of times a year
  # -- and concluded nobody had made that trade. This is the trade nobody
  # wrote down: build them when the files that define them change, which is
  # exactly when a hash can move, and on every other push spend one `git diff`.
  #
  # It lives in ci.yml rather than in a workflow of its own on purpose.
  # hack/require-green-ci.sh reads *this* workflow's run conclusion and never a
  # job's, so a job added here is inside the release gate for free, and a red
  # one stops a tag. A separate workflow would be outside it.
  #
  # What it does not cover, and the nightly still does: a hash breaks when the
  # bytes at a URL change, and upstream can do that without a line of this
  # repository moving. nightly.yml builds all four derivations unconditionally
  # and opens an issue when they fail. This job narrows the window between a
  # bad commit and 03:17 the next morning; it does not replace the thing
  # watching for changes that arrive from outside.
  images:
    runs-on: ubuntu-latest
    # Measured against nightly.yml, which builds four derivations twice each in
    # eight to ten minutes on a cold runner. Two derivations once is a small
    # fraction of that; twenty-five is the same allowance the test job gets and
    # is here to stop a wedged run rather than to describe one.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # The decision below diffs against a base commit, which needs more
          # than the default shallow clone.
          fetch-depth: 0

      - name: Which files moved
        id: changed
        env:
          # For a pull request, the branch point. For a push, the commit the
          # branch was at before it -- all zeros on a branch's first push,
          # which the script reads as "cannot tell" and builds.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: hack/image-derivations-changed.sh "${BASE}" "${GITHUB_SHA}"

      - name: Install Nix
        if: steps.changed.outputs.build == 'true'
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Not `make image-test`: that loads them into a kind cluster and runs a
      # server, which is the e2e job's business. The question here is narrower
      # and is the one the fixed-output hashes answer to -- do these two
      # derivations still build, which means do their downloads still hash to
      # what the files say.
      - name: Build the Paper and Velocity images
        if: steps.changed.outputs.build == 'true'
        run: |
          nix build .#paper-image --no-link
          nix build .#velocity-image --no-link

  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The drift guard docs/known-issues.md has been parking since milestone
      # 2c. make agent-deps regenerates agent/deps.json by resolving against
      # Maven Central, which is why it cannot run inside a Nix build and why
      # it lives here. It is also the only check in this workflow that can go
      # red for a reason outside this repository: an outage upstream, or an
      # artifact moving, produces a diff nobody caused.
      #
      # USE_BWRAP=0: the mitmCache updateScript nixpkgs builds for this
      # (gradle.fetchDeps) wraps the actual Gradle dependency fetch in its
      # own bwrap sandbox -- unrelated to Nix's own build sandbox, and on
      # by default -- solely "to prevent messy build scripts from touching
      # ~" per the script's own comment. That bwrap call needs unprivileged
      # user namespaces, which GitHub's hosted Ubuntu runners restrict by
      # default, so it fails before Gradle ever runs: "bwrap: setting up
      # uid map: Permission denied". Two earlier attempts on this branch
      # (sandbox = false in extra_nix_config; installing Nix single-user)
      # changed Nix's own sandbox setting and had no effect, because Nix's
      # sandbox was never the thing failing -- this script's independent
      # bwrap call was. USE_BWRAP=0 is the escape hatch the script itself
      # defines for exactly this case, trading only the containment of a
      # trusted, first-party Gradle invocation touching $HOME.
      - name: make agent-deps
        run: nix develop -c make agent-deps
        env:
          USE_BWRAP: "0"

      - name: agent/deps.json is in step with build.gradle.kts
        run: git diff --exit-code -- agent/deps.json

  e2e:
    runs-on: ubuntu-latest
    # hack/e2e.sh builds the operator image with Nix, creates a kind cluster,
    # loads the image, helm installs the chart into platform-system and runs
    # eighteen scenarios. On the author's machine the Go test time alone is
    # about 140s; the image build and cluster creation dominate a cold run.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # No KIND_EXPERIMENTAL_PROVIDER and no systemd-run: those belong to the
      # rootless-podman invocation hack/e2e.sh documents for the author's
      # machine. A hosted runner has a Docker daemon, which is kind's default.
      - name: make e2e
        run: nix develop -c make e2e
