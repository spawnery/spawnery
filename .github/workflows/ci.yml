name: CI

on:
  push:
    branches: [master]
  pull_request:

# A second push to the same branch cancels the first: nothing here needs the
# older run's answer, and the runners are shared.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # make test runs manifests, generate, fmt, vet and chart-lint before
    # go test -race across every package, several of which are envtest-backed
    # and start a real API server. Twenty-five minutes is roughly double what
    # it takes on the author's machine.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Timed on purpose. The store is cold on every hosted runner, and this
      # number is what decides whether a cache is worth its dependency --
      # see the design's §2.1.
      - name: Warm the dev shell
        run: |
          start=$(date +%s)
          nix develop -c true
          echo "dev shell ready in $(( $(date +%s) - start ))s"

      - name: make test
        run: nix develop -c make test

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: make lint
        run: nix develop -c make lint

  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Unlike test and lint, this job builds a derivation that is not on
      # any binary cache -- gradle.fetchDeps's updateScript is unique to
      # this flake -- so it is the one job that actually invokes Nix's
      # build sandbox rather than only substituting. That sandbox uses
      # bwrap, which needs unprivileged user namespaces; Ubuntu's hosted
      # runners restrict those by default via AppArmor, and bwrap fails
      # with "setting up uid map: Permission denied". Setting `sandbox =
      # false` in extra_nix_config did not avoid this -- the multi-user
      # daemon (install-nix-action's default here) still invoked bwrap, so
      # the setting was not taking effect for daemon-driven builds. Lifting
      # the kernel-level restriction directly is what actually works.
      - name: Allow unprivileged user namespaces (bwrap needs this)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The drift guard docs/known-issues.md has been parking since milestone
      # 2c. make agent-deps regenerates agent/deps.json by resolving against
      # Maven Central, which is why it cannot run inside a Nix build and why
      # it lives here. It is also the only check in this workflow that can go
      # red for a reason outside this repository: an outage upstream, or an
      # artifact moving, produces a diff nobody caused.
      - name: make agent-deps
        run: nix develop -c make agent-deps

      - name: agent/deps.json is in step with build.gradle.kts
        run: git diff --exit-code -- agent/deps.json
