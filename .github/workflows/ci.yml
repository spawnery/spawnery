name: CI

on:
  push:
    branches: [master]
  pull_request:

# Never cancel on master: a cancelled master run is never re-run, and a v* tag
# on that commit would publish from a ref CI never finished.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # About 4.7x the job's runtime on a runner; sized to stop a wedged run.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            # The default ten lines end inside Gradle's eight-line "Try:" block,
            # before the failing test's name.
            log-lines = 40

      # Timed on purpose: this number decides whether a Nix cache would pay off.
      - name: Warm the dev shell
        run: |
          start=$(date +%s)
          nix develop -c true
          echo "dev shell ready in $(( $(date +%s) - start ))s"

      - name: make test
        run: nix develop -c make test

      # make test regenerates manifests and runs go fmt before testing, so its
      # own run is green against a stale commit; only this diff catches it.
      - name: the generated files are in step with their sources
        run: |
          set -euo pipefail
          if ! git diff --exit-code; then
            echo >&2
            echo "make test regenerated a tracked file and the result differs from what is" >&2
            echo "committed. Run 'make manifests generate fmt' and commit the diff above." >&2
            exit 1
          fi
          # git diff does not see a newly generated file, such as a new CRD.
          untracked="$(git ls-files --others --exclude-standard -- api config charts docs/reference)"
          if [ -n "$untracked" ]; then
            echo "make test generated a file that is not committed:" >&2
            echo "$untracked" >&2
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            # The default ten lines end inside Gradle's eight-line "Try:" block,
            # before the failing test's name.
            log-lines = 40

      - name: make lint
        run: nix develop -c make lint

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            # The default ten lines end inside Gradle's eight-line "Try:" block,
            # before the failing test's name.
            log-lines = 40

      - name: make docs
        run: nix develop -c make docs

  # The game images, built only when a file that defines them moved, which is
  # when a fixed-output hash can break. Upstream bytes changing under a URL are
  # nightly.yml's job.
  #
  # Kept in ci.yml: hack/require-green-ci.sh gates releases on this workflow's
  # conclusion, so a job in a separate workflow would be outside the gate.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Which files moved
        id: changed
        env:
          # All zeros on a branch's first push; the script then builds.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: hack/image-derivations-changed.sh "${BASE}" "${GITHUB_SHA}"

      - name: Install Nix
        if: steps.changed.outputs.build == 'true'
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            # The default ten lines end inside Gradle's eight-line "Try:" block,
            # before the failing test's name.
            log-lines = 40

      # Not `make image-test`: running a server is e2e's business; this only
      # checks that the downloads still hash to what the files say.
      - name: Build the game images
        if: steps.changed.outputs.build == 'true'
        run: |
          nix build .#purpur-image --no-link
          nix build .#purpur-image-26-2 --no-link
          nix build .#velocity-image --no-link

  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            # The default ten lines end inside Gradle's eight-line "Try:" block,
            # before the failing test's name.
            log-lines = 40

      # Resolves against Maven Central, so it can go red from an upstream
      # outage with no change here.
      #
      # USE_BWRAP=0: gradle.fetchDeps' update script runs Gradle in its own
      # bwrap (not Nix's sandbox), which needs unprivileged user namespaces
      # that hosted Ubuntu runners restrict.
      - name: make agent-deps
        run: nix develop -c make agent-deps
        env:
          USE_BWRAP: "0"

      - name: agent/deps.json is in step with build.gradle.kts
        run: git diff --exit-code -- agent/deps.json

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            # The default ten lines end inside Gradle's eight-line "Try:" block,
            # before the failing test's name.
            log-lines = 40

      # No KIND_EXPERIMENTAL_PROVIDER/systemd-run: the runner has Docker.
      - name: make e2e
        run: nix develop -c make e2e
