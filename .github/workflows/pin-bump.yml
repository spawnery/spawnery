name: Pin bump

on:
  schedule:
    # Mondays, after the nightly at 03:17, off the hour.
    - cron: "23 4 * * 1"
  workflow_dispatch:

# Writes go through the app token below: a pull request opened with
# GITHUB_TOKEN starts no ci.yml run, and this repository does not let
# GITHUB_TOKEN open pull requests at all.
permissions:
  contents: read

concurrency:
  group: pin-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BRANCH: auto/upstream-pins
    steps:
      - name: App token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PIN_BOT_APP_ID }}
          private-key: ${{ secrets.PIN_BOT_PRIVATE_KEY }}

      # Tags: hack/image-version-bump.sh numbers the release from them.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            # Nix 2.35 retries a connection error 5 times by default and no 4xx at
            # all; when cache.nixos.org answers HTTP 416, fallback builds the path.
            filetransfer-retry-attempts = 10
            fallback = true

      - name: Commit as the app
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          set -euo pipefail
          id="$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)"
          git config user.name "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"

      # Paper first: purpur-pin.sh and canvas-pin.sh refuse a build that wants
      # another Mojang jar than nix/paper.nix pins. All three stay on the pinned
      # Minecraft version; moving to a new one is not a weekly chore.
      - name: Move the Paper and Purpur pins
        id: base
        timeout-minutes: 10
        run: |
          set -euo pipefail
          pin() { sed -n "s/^  $1 = \"\(.*\)\";$/\1/p" "$2"; }
          {
            echo "paper_old=$(pin paperBuild nix/paper.nix)"
            echo "purpur_old=$(pin purpurBuild nix/purpur.nix)"
            echo "canvas_old=$(pin canvasBuild nix/canvas.nix)"
          } >>"$GITHUB_OUTPUT"
          nix develop -c hack/paper-pin.sh
          nix develop -c hack/purpur-pin.sh

      # Canvas is tried apart from the other two: a refusal, an outage or a
      # slow test must not stop the Paper and Purpur bump. A moved pin has to
      # pass its image and agent tests before it joins; whatever goes wrong,
      # nix/canvas.nix is put back and canvas_failed says why.
      - name: Try the Canvas pin
        id: canvas
        continue-on-error: true
        timeout-minutes: 30
        env:
          CANVAS_OLD: ${{ steps.base.outputs.canvas_old }}
        run: |
          set -euo pipefail
          pin() { sed -n "s/^  $1 = \"\(.*\)\";$/\1/p" "$2"; }
          fail() {
            git checkout nix/canvas.nix
            echo "canvas_failed=$1" >>"$GITHUB_OUTPUT"
            echo "::warning::Canvas is not in this bump: $1"
            echo "Canvas is not in this bump: $1" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          }
          err="$RUNNER_TEMP/canvas-pin.err"
          if ! nix develop -c hack/canvas-pin.sh 2>"$err"; then
            cat "$err" >&2
            line="$(grep -m1 '^canvas-pin:' "$err" || head -n1 "$err")"
            fail "pin refused: ${line#canvas-pin: }"
          fi
          cat "$err" >&2
          candidate="$(pin canvasBuild nix/canvas.nix)"
          if [ "$candidate" != "$CANVAS_OLD" ]; then
            nix develop -c make canvas-image-test canvas-agent-test || fail "$candidate"
          fi

      - name: Collect the pins
        id: pins
        env:
          PAPER_OLD: ${{ steps.base.outputs.paper_old }}
          PURPUR_OLD: ${{ steps.base.outputs.purpur_old }}
          CANVAS_OLD: ${{ steps.base.outputs.canvas_old }}
          CANVAS_FAILED: ${{ steps.canvas.outputs.canvas_failed }}
          CANVAS_OUTCOME: ${{ steps.canvas.outcome }}
        run: |
          set -euo pipefail
          pin() { sed -n "s/^  $1 = \"\(.*\)\";$/\1/p" "$2"; }
          paper_old="$PAPER_OLD"
          purpur_old="$PURPUR_OLD"
          canvas_old="$CANVAS_OLD"
          canvas_failed="$CANVAS_FAILED"

          if [ "$CANVAS_OUTCOME" != success ]; then
            git checkout nix/canvas.nix
            canvas_failed="the Canvas step ended with $CANVAS_OUTCOME before it finished"
            echo "::warning::Canvas is not in this bump: $canvas_failed"
            echo "Canvas is not in this bump: $canvas_failed" >>"$GITHUB_STEP_SUMMARY"
          fi

          paper_new="$(pin paperBuild nix/paper.nix)"
          purpur_new="$(pin purpurBuild nix/purpur.nix)"
          canvas_new="$(pin canvasBuild nix/canvas.nix)"
          mc="$(pin paperVersion nix/paper.nix)"
          canvas_mc="$(pin canvasVersion nix/canvas.nix)"

          summary=""
          [ "$paper_old" = "$paper_new" ] || summary="Paper $mc build $paper_new"
          if [ "$purpur_old" != "$purpur_new" ]; then
            summary="${summary:+$summary, }Purpur $mc build $purpur_new"
          fi
          if [ "$canvas_old" != "$canvas_new" ]; then
            summary="${summary:+$summary, }Canvas $canvas_mc build $canvas_new"
          fi
          {
            echo "mc=$mc"
            echo "canvas_mc=$canvas_mc"
            echo "paper_old=$paper_old"
            echo "paper_new=$paper_new"
            echo "purpur_old=$purpur_old"
            echo "purpur_new=$purpur_new"
            echo "canvas_old=$canvas_old"
            echo "canvas_new=$canvas_new"
            echo "canvas_failed=$canvas_failed"
            echo "summary=$summary"
            echo "moved=$([ -n "$summary" ] && echo true || echo false)"
          } >>"$GITHUB_OUTPUT"
          echo "moved: ${summary:-nothing}"

          if [ -z "$summary" ] && [ -n "$canvas_failed" ]; then
            echo "::error::Canvas is not in this bump and nothing else moved: $canvas_failed"
            exit 1
          fi

      # A failed Canvas pin is put back, so a pull request that moved only
      # Canvas looks caught up with although master is not.
      - name: Close a pull request master has caught up with
        if: steps.pins.outputs.moved == 'false' && steps.pins.outputs.canvas_failed == ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          [ -n "$pr" ] || exit 0
          gh pr close "$pr" --delete-branch \
            --comment "master already names the newest builds; closed by ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Commit the pins and number the release
        id: commit
        if: steps.pins.outputs.moved == 'true'
        run: |
          set -euo pipefail
          git switch -c "$BRANCH"
          git add nix/paper.nix nix/purpur.nix nix/canvas.nix
          git commit -q -m "fix(images): ${{ steps.pins.outputs.summary }}"

          nix develop -c hack/image-version-bump.sh
          nix develop -c make image-tag-lint
          version="$(nix eval --raw .#agents.version)"
          if ! git diff --quiet; then
            git commit -q -a -m "chore: ${version}, game images on ${{ steps.pins.outputs.summary }}"
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

          # The same tree as last week's push needs neither a test nor a push.
          if git fetch -q origin "$BRANCH" 2>/dev/null &&
            git diff --quiet FETCH_HEAD HEAD; then
            echo "unchanged=true" >>"$GITHUB_OUTPUT"
            echo "origin/$BRANCH already carries this tree"
          else
            echo "unchanged=false" >>"$GITHUB_OUTPUT"
          fi

      # What ci.yml cannot say for a pin: whether a server starts on it and the
      # agent talks to the operator. Both need a container runtime and no kind.
      - name: Start a server on the new pins
        id: test
        if: steps.pins.outputs.moved == 'true' && steps.commit.outputs.unchanged == 'false'
        continue-on-error: true
        # A hang still ends in a draft pull request rather than a cancelled job.
        timeout-minutes: 40
        run: |
          set -euo pipefail
          nix develop -c make purpur-image-test agent-test 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Push and open or update the pull request
        if: steps.pins.outputs.moved == 'true' && steps.commit.outputs.unchanged == 'false'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          MC: ${{ steps.pins.outputs.mc }}
          SUMMARY: ${{ steps.pins.outputs.summary }}
          PAPER_OLD: ${{ steps.pins.outputs.paper_old }}
          PAPER_NEW: ${{ steps.pins.outputs.paper_new }}
          PURPUR_OLD: ${{ steps.pins.outputs.purpur_old }}
          PURPUR_NEW: ${{ steps.pins.outputs.purpur_new }}
          CANVAS_MC: ${{ steps.pins.outputs.canvas_mc }}
          CANVAS_OLD: ${{ steps.pins.outputs.canvas_old }}
          CANVAS_NEW: ${{ steps.pins.outputs.canvas_new }}
          CANVAS_FAILED: ${{ steps.pins.outputs.canvas_failed }}
          VERSION: ${{ steps.commit.outputs.version }}
          OUTCOME: ${{ steps.test.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/body.md"
          title="fix(images): $SUMMARY"

          if [ "$OUTCOME" = success ]; then
            verdict="\`make purpur-image-test agent-test\` passed on this tree: the image starts a server with no network, and both agents run their session against the stub operator."
          else
            verdict="**\`make purpur-image-test agent-test\` failed on this tree.** The pull request stays a draft until a run passes. Log below and in the [run]($RUN_URL)."
          fi

          {
            echo "Moves the game images to newer upstream builds of Minecraft $MC and numbers the release that ships them."
            echo
            echo "| | before | after |"
            echo "|---|---|---|"
            echo "| Paper | $PAPER_OLD | $PAPER_NEW |"
            echo "| Purpur | $PURPUR_OLD | $PURPUR_NEW |"
            echo "| Canvas | $CANVAS_OLD | $CANVAS_NEW |"
            echo "| imageVersion | $(git show origin/master:flake.nix | sed -n 's/^[[:space:]]*imageVersion = "\([^"]*\)";/\1/p') | $VERSION |"
            echo
            echo "$verdict"
            echo
            if [ "$CANVAS_OLD" != "$CANVAS_NEW" ]; then
              echo "Canvas build $CANVAS_NEW passed \`make canvas-image-test canvas-agent-test\` before it joined this bump."
              echo
            fi
            if [[ "$CANVAS_FAILED" =~ ^[0-9]+$ ]]; then
              echo "Canvas build $CANVAS_FAILED failed its tests and is not in this bump."
              echo
            elif [ -n "$CANVAS_FAILED" ]; then
              echo "Canvas is not in this bump: $CANVAS_FAILED."
              echo
            fi
            echo "Nothing here runs the plugins a network installs on top. A build that breaks one of them shows up in its changelog below, not in the test."
            echo
            echo "After the merge, \`git tag -s v$VERSION\` once CI on master is green."
            for p in paper purpur canvas; do
              old_var="${p^^}_OLD"; new_var="${p^^}_NEW"
              [ "${!old_var}" != "${!new_var}" ] || continue
              version="$MC"; [ "$p" != canvas ] || version="$CANVAS_MC"
              echo
              echo "<details><summary>${p^} $version, builds after ${!old_var} up to ${!new_var}</summary>"
              echo
              nix develop -c hack/upstream-changes.sh "$p" "$version" "${!old_var}" "${!new_var}" ||
                echo "(the changelog could not be fetched)"
              echo
              echo "</details>"
            done
            echo
            echo "<details><summary>Test log, last 60 lines</summary>"
            echo
            echo '```'
            tail -60 "$RUNNER_TEMP/test.log" 2>/dev/null || echo "(no log)"
            echo '```'
            echo
            echo "</details>"
            echo
            echo "Opened by \`.github/workflows/pin-bump.yml\` ([run]($RUN_URL)). The next run force-pushes this branch onto master again."
          } >"$body"

          git push -q --force origin "HEAD:refs/heads/$BRANCH"

          pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            draft=()
            [ "$OUTCOME" = success ] || draft=(--draft)
            gh pr create --base master --head "$BRANCH" --title "$title" --body-file "$body" "${draft[@]}"
          else
            gh pr edit "$pr" --title "$title" --body-file "$body"
            if [ "$OUTCOME" = success ]; then
              gh pr ready "$pr" 2>/dev/null || true
            else
              gh pr ready "$pr" --undo 2>/dev/null || true
            fi
          fi

      - name: Fail the run on a failed server test
        if: steps.test.outcome == 'failure'
        run: |
          echo "::error::the new pins did not pass make purpur-image-test agent-test; see the pull request"
          exit 1
