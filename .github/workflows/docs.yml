name: Docs

# Builds and pushes the docs image, then moves k8s/docs/deployment.yaml to its
# tag for Flux to apply. Not Flux ImageUpdateAutomation: the cluster holds no
# write credential for this repository, and this workflow already has one.

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'overrides/**'
      - 'nix/docs-site.nix'
      - 'nix/docs-image.nix'
      - 'nix/mermaid.nix'
      - 'nix/fonts.nix'
      # Excluded from the built site too, so a change there publishes nothing new.
      - '!docs/superpowers/**'
      # flake.lock and flake.nix deliberately absent: the next docs commit
      # picks up a nixpkgs bump anyway.

# Queue rather than cancel: every run publishes an image, and runs land on
# master in push order.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            # The default ten lines end inside Gradle's eight-line "Try:" block,
            # before the failing test's name.
            log-lines = 40

      - name: Build the image
        run: echo "archive=$(nix build .#docs-image --no-link --print-out-paths)" >> "$GITHUB_ENV"

      # skopeo otherwise writes to $XDG_RUNTIME_DIR, which hosted runners leave
      # unset, and its fallback path is not creatable by a non-root runner.
      - name: Where skopeo keeps its credential
        run: echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/auth.json" >> "$GITHUB_ENV"

      - name: Push it
        run: |
          short="$(git rev-parse --short HEAD)"
          nix develop -c skopeo login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"
          nix develop -c skopeo copy \
            "docker-archive:$archive" "docker://ghcr.io/spawnery/docs:sha-$short"
          echo "tag=sha-$short" >> "$GITHUB_ENV"

      - name: Move the Deployment to it
        run: |
          # The checkout may already be behind master; commit on a fresh fetch
          # so the push stays a fast-forward.
          git fetch origin master
          git checkout -B master FETCH_HEAD

          sed -i -E "s|^([[:space:]]*image: ghcr\.io/spawnery/docs:)[^[:space:]]+|\1$tag|" k8s/docs/deployment.yaml

          # GNU sed exits 0 even when nothing matched.
          if ! grep -qE "^[[:space:]]*image: ghcr\.io/spawnery/docs:${tag}([[:space:]]|\$)" k8s/docs/deployment.yaml; then
            echo "::error::k8s/docs/deployment.yaml has no image line at $tag -- the sed above matched nothing"
            exit 1
          fi

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Another run may already have moved the tag; git commit would exit 1.
          if git diff --quiet -- k8s/docs/deployment.yaml; then
            echo "k8s/docs/deployment.yaml already at $tag; nothing to commit"
            exit 0
          fi

          git commit -am "chore(docs): $tag" -m "[skip ci]"
          # No retrigger: this commit touches only k8s/, which paths above does
          # not list; [skip ci] covers the day it does.
          git push origin HEAD:master
