# Lets the operator read the forwarding secrets in one Network namespace, to
# detect a rotation. Apply it per namespace that holds a Network:
#
#   kubectl apply -n <network-namespace> -f config/rbac/forwarding-secret-reader.yaml
#
# The operator never creates RBAC itself: one that may write RBAC makes every
# other restriction on it advisory.
#
# Prefer the chart's networkNamespaces, which adds resourceNames and binds the
# release's own namespace instead of the hard-coded spawnery-system below. This
# file is for namespaces created after the chart was installed. Either way the
# narrowing is small: the operator may create pods, which can mount any Secret
# in the namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spawnery-forwarding-secret-reader
  labels:
    app.kubernetes.io/name: spawnery
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spawnery-forwarding-secret-reader
  labels:
    app.kubernetes.io/name: spawnery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spawnery-forwarding-secret-reader
subjects:
- kind: ServiceAccount
  name: spawnery-operator
  namespace: spawnery-system
