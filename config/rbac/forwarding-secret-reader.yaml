# The operator reads each Network's forwarding secret to detect a rotation of
# the Velocity modern forwarding secret. This file is what authorises that,
# one namespace at a time.
#
# Deliberately NOT part of config/deploy/. The ClusterRole grants no access to
# secrets outside the operator's own namespace, and an administrator opens
# exactly the namespaces that hold a Network:
#
#   kubectl apply -n <network-namespace> -f config/rbac/forwarding-secret-reader.yaml
#
# Neither object carries metadata.namespace, so the apply supplies it. The
# operator never creates these itself: one that may write RBAC makes every
# other restriction on it advisory, which is why the same audit denies it
# clusterroles/create.
#
# A namespace where nobody applied this reports itself — the Network's
# ForwardingSecretResolved condition reads Unknown/SecretReadForbidden and its
# message names this file. Milestone 6's Helm chart is where rendering it for
# each configured namespace belongs.
#
# The rule below carries no resourceNames, and the master design's §8 asks for
# one: it says the secrets grant should be "restricted through resourceNames to
# the secrets referenced in networks". resourceNames does restrict get, which is
# the only verb here, so the deviation is a choice and not an impossibility.
# What it costs is this file applying unedited: with resourceNames every
# administrator names each Network's secret per namespace, and edits again
# whenever one is renamed. What it buys is small — the operator holds
# pods: create cluster-wide (internal/rbacaudit/required.go:52), and a pod it
# creates can mount any Secret in the namespace, so a name-scoped get narrows
# nothing an attacker holding this ServiceAccount could not walk around.
# Milestone 6's chart, where a per-namespace value renders the list, is where it
# becomes cheap enough to be worth having.
#
# The audit does not see this. rbacaudit.Permission has no ResourceNames field
# (internal/rbacaudit/permissions.go:35-48), so both directions of the
# comparison against rbacaudit.RequiredNetworkNamespace pass whether the rule
# names objects or not.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spawnery-forwarding-secret-reader
  labels:
    app.kubernetes.io/name: spawnery
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spawnery-forwarding-secret-reader
  labels:
    app.kubernetes.io/name: spawnery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spawnery-forwarding-secret-reader
subjects:
- kind: ServiceAccount
  name: spawnery-operator
  namespace: spawnery-system
