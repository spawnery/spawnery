apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spawnery-operator
  # Muss der Namespace der Role aus config/rbac/role.yaml sein: eine RoleBinding
  # gewährt ausschließlich in ihrem eigenen Namespace. Steht sie woanders,
  # gewährt sie gar nichts, und der Operator scheitert beim ersten
  # certs.Store.Ensure mit Forbidden.
  namespace: spawnery-system
  labels:
    app.kubernetes.io/name: spawnery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spawnery-operator
subjects:
  - kind: ServiceAccount
    name: spawnery-operator
    namespace: spawnery-system
