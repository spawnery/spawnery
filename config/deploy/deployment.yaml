apiVersion: apps/v1
kind: Deployment
metadata:
  name: spawnery-operator
  namespace: spawnery-system
  labels:
    app.kubernetes.io/name: spawnery
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  # Replace, do not overlap. Ever since readyz hangs off the leader lock, a new
  # pod only turns ready once it holds that lock — and the old pod holds it for
  # as long as it runs. With a single replica a rolling update waits for
  # exactly that readiness (maxUnavailable 0) before it removes the old pod, so
  # it would sit there until somebody intervenes by hand. Do not switch this
  # back to RollingUpdate.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: spawnery
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spawnery
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: spawnery-operator
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          # Level B replaces this image with the locally built one.
          image: ghcr.io/spawnery/spawnery-operator:dev
          args:
            - --leader-elect=true
            - --startup-deadline=20s
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          env:
            # The default for --operator-namespace. Both the SANs of the
            # serving certificate and the address the agents dial derive
            # from it.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
            - name: agent
              containerPort: 9443
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
