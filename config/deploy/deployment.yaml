apiVersion: apps/v1
kind: Deployment
metadata:
  name: spawnery-operator
  namespace: spawnery-system
  labels:
    app.kubernetes.io/name: spawnery
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  # Ersetzen statt überlappen. Seit readyz an der Leader-Sperre hängt, wird ein
  # neuer Pod erst bereit, nachdem er die Sperre hat — und die hält der alte,
  # solange er läuft. Ein rollendes Update wartet bei einer Replik auf genau
  # diese Bereitschaft (maxUnavailable 0), bevor es den alten Pod abräumt, und
  # bliebe deshalb stehen, bis jemand von Hand nachhilft. Nicht auf
  # RollingUpdate zurückstellen.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: spawnery
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spawnery
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: spawnery-operator
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          # Ebene B ersetzt dieses Image durch das lokal gebaute.
          image: ghcr.io/spawnery/spawnery-operator:dev
          args:
            - --leader-elect=true
            - --startup-deadline=20s
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          env:
            # Vorgabe für --operator-namespace. Daraus ergeben sich sowohl die
            # SANs des Serverzertifikats als auch die Adresse, die die Agents
            # anwählen.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
            - name: agent
              containerPort: 9443
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
