  name: proxygroups.spawnery.cloud
spec:
  group: spawnery.cloud
  names:
    kind: ProxyGroup
    listKind: ProxyGroupList
    plural: proxygroups
    shortNames:
    - mcproxy
    singular: proxygroup
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
