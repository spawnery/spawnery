                      claim is, pulled with the pod's imagePullSecrets. A digest reference
                      rolls the group whenever it changes; a tag does not.
                    minLength: 1
                    type: string
                  pullPolicy:
                    description: PullPolicy for Image. Empty means IfNotPresent.
                    enum:
                    - Always
                    - IfNotPresent
                    - Never
                    type: string
                type: object
                x-kubernetes-validations:
                - message: 'extraFiles: exactly one of claimName or image must be
                    set'
                  rule: has(self.claimName) != has(self.image)
                - message: 'extraFiles: pullPolicy applies to an image source only'
                  rule: '!has(self.pullPolicy) || has(self.image)'
              extraPlugins:
                description: |-
                  ExtraPlugins names a volume whose plugins and their configuration are
                  copied into this group's servers on every start. See ExtraPlugins.
                properties:
                  claimName:
                    description: |-
                      ClaimName is a PersistentVolumeClaim in this object's own namespace.

                      It must be ReadWriteMany, even for a single-replica group: a
                      ReadWriteOnce claim would leave the second server Pending on a volume
                      affinity error.
                    minLength: 1
                    type: string
                  image:
                    description: |-
                      Image names an OCI image whose filesystem root is what the claim's root
                      would be. It is mounted read-only as an image volume and copied as a
                      claim is, pulled with the pod's imagePullSecrets. A digest reference
                      rolls the group whenever it changes; a tag does not.
                    minLength: 1
                    type: string
                  pullPolicy:
                    description: PullPolicy for Image. Empty means IfNotPresent.
                    enum:
                    - Always
                    - IfNotPresent
                    - Never
                    type: string
                type: object
                x-kubernetes-validations:
                - message: 'extraPlugins: exactly one of claimName or image must be
                    set'
                  rule: has(self.claimName) != has(self.image)
                - message: 'extraPlugins: pullPolicy applies to an image source only'
                  rule: '!has(self.pullPolicy) || has(self.image)'
              image:
                description: Image is the Velocity base image. A digest reference
                  is recommended.
                minLength: 1
                type: string
              mounts:
                description: Mounts are extra ConfigMap, Secret and PersistentVolumeClaim
                  mounts.
                items:
                  description: |-
                    Mount is a single file mount into a managed pod: a ConfigMap, a Secret, or
                    a PersistentVolumeClaim.

                    The claim carries what an image cannot: a world tree, a directory of assets
                    every server reads, a pool one group writes and another reads.

                    A mount is one volume at one path. There is no composition, priority or
                    per-server rendering.
                  properties:
                    configMap:
                      description: ConfigMap source.
                      properties:
                        defaultMode:
                          description: |-
                            defaultMode is optional: mode bits used to set permissions on created files by default.
                            Must be an octal value between 0000 and 0777 or a decimal value between 0 and 511.
                            YAML accepts both octal and decimal values, JSON requires decimal values for mode bits.
                            Defaults to 0644.
                            Directories within the path are not affected by this setting.
                            This might be in conflict with other options that affect the file
                            mode, like fsGroup, and the result can be other mode bits set.
                          format: int32
                          type: integer
                        items:
                          description: |-
                            items if unspecified, each key-value pair in the Data field of the referenced
                            ConfigMap will be projected into the volume as a file whose name is the
                            key and content is the value. If specified, the listed keys will be
                            projected into the specified paths, and unlisted keys will not be
                            present. If a key is specified which is not present in the ConfigMap,
                            the volume setup will error unless it is marked optional. Paths must be
                            relative and may not contain the '..' path or start with '..'.
                          items:
                            description: Maps a string key to a path within a volume.
                            properties:
                              key:
                                description: key is the key to project.
                                type: string
                              mode:
                                description: |-
                                  mode is Optional: mode bits used to set permissions on this file.
                                  Must be an octal value between 0000 and 0777 or a decimal value between 0 and 511.
                                  YAML accepts both octal and decimal values, JSON requires decimal values for mode bits.
                                  If not specified, the volume defaultMode will be used.
                                  This might be in conflict with other options that affect the file
                                  mode, like fsGroup, and the result can be other mode bits set.
                                format: int32
                                type: integer
                              path:
                                description: |-
                                  path is the relative path of the file to map the key to.
                                  May not be an absolute path.
                                  May not contain the path element '..'.
                                  May not start with the string '..'.
                                type: string
                            required:
                            - key
                            - path
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                        name:
                          default: ""
                          description: |-
