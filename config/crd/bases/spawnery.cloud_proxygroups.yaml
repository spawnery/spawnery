---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: proxygroups.spawnery.cloud
spec:
  group: spawnery.cloud
  names:
    kind: ProxyGroup
    listKind: ProxyGroupList
    plural: proxygroups
    shortNames:
    - mcproxy
    singular: proxygroup
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .status.address
      name: Address
      type: string
    - jsonPath: .status.connectedPlayers
      name: Players
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ProxyGroup is the Velocity layer of a network.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ProxyGroupSpec describes the Velocity layer of a network.
            properties:
              attributes:
                additionalProperties:
                  type: string
                description: |-
                  Attributes is what plugins are told about this group. See
                  GroupAttributes: the operator carries it and acts on none of it.

                  It shapes no pod and is therefore not in the spec hash a server is
                  replaced on -- the opposite of Env above. Editing it replaces nothing
                  and restarts nothing; the next network picture simply carries the new
                  value, which is what a description of a group should cost.
                maxProperties: 16
                type: object
                x-kubernetes-validations:
                - message: an attribute name may be 64 characters and a value 256
                  rule: self.all(k, size(k) <= 64 && size(self[k]) <= 256)
              config:
                description: Config are the rendered Velocity settings.
                properties:
                  motd:
                    description: |-
                      Motd is shown in the server list.

                      Editing it does not replace the group's proxies. It reaches only the
                      group's ConfigMap, which the pod names in a volume, so the new value
                      applies to the next proxy pod and to no existing one -- cosmetic here,
                      and not cosmetic on OnlineMode below, which behaves the same way.
                    type: string
                  onlineMode:
                    default: true
                    description: |-
                      OnlineMode is whether the proxy authenticates players with Mojang.

                      Turning it off means the proxy stops authenticating anyone: any client
                      may connect under any name, including the name of a player who has
                      paid for the game and owns things on this network, and the network is
                      only as protected as whatever sits in front of it. There is nothing
                      further down that catches it — the backends run online-mode=false by
                      design, because the proxy is the layer that was supposed to do this.

                      It is a field on the custom resource rather than something reachable
                      through configOverlay so that turning it off is a visible edit to the
                      object an operator reviews, not a line in a ConfigMap nobody reads.

                      This is the proxy's own online-mode, not the backends'
                      proxies.velocity.online-mode in paper-global.yml, which means "trust
                      what the proxy forwards" and stays true either way: modern forwarding
                      works the same whether the proxy authenticated the player or not.

                      Editing it does not replace the group's proxies, and nothing on the
                      object says so. Like Motd it reaches only the group's ConfigMap, which
                      spawnery-config reads at container start, so a running proxy goes on
                      authenticating players the old way while observedGeneration advances
                      and the phase stays Ready -- every signal the API offers says the
                      change is applied. PlayerLimit, its sibling under the same stanza,
                      *does* roll the group, because it reaches the pod as an environment
                      variable; nothing about the stanza distinguishes them and only
                      internal/podspec/proxy.go does.

                      After changing this, delete the group's proxy pods or edit a field that
                      does roll it -- PlayerLimit is the cheapest. Leaving it is worse than it
                      looks: a pod that restarts later for an unrelated reason picks the new
                      value up on its own, so the group drifts into running both settings at
                      once.
                    type: boolean
                  playerLimit:
                    description: PlayerLimit is the network-wide player limit of one
                      proxy.
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              configOverlay:
                description: |-
                  ConfigOverlay names a ConfigMap whose keys are configuration files to
                  merge over the rendered defaults — "server.properties",
                  "paper-global.yml", "paper-world-defaults.yml" or "velocity.toml", in
                  the target's own dialect.

                  paper-world-defaults.yml is the one of those the operator writes only
                  when an overlay names it. Nothing in it is operationally critical, so
                  there is nothing to assert into it, and a file written empty on every
                  start would overwrite whatever the server had filled in for itself. It
                  is also the only route that file has: a mount cannot deliver it, because
                  a mount anywhere under /data/config stops the server writing its own
                  configuration and it never starts. See internal/podspec.ServerConfigDirPath.

                  It is a field of its own rather than a reserved name inside mounts,
                  because mounts is documented as raw files for plugins and worlds and a
                  name-based convention is invisible until someone picks that name by
                  accident. It outranks the rendered defaults and is outranked by the
                  operationally critical fields, which nothing can reach.

                  A key the receiving program does not declare is refused rather than
                  written. Paper and Velocity both keep their own default for a key they
                  do not read and write the stray one straight back out, so the rendered
                  file goes on looking like the override took while the setting never
                  applies -- which is the failure this refusal exists to prevent, and
                  which has cost this project two outages. The declared keys are measured
                  from each program's own default configuration, so a Paper or Velocity
                  bump can refuse a legitimately new key until that measurement is
                  retaken. server.properties is the exception: it has no such
                  measurement, so a mistyped key there is still only an unused one.
                properties:
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              displayName:
                description: |-
                  DisplayName is what this group is called where a person reads it:
                  a scoreboard, a chat message, a playtime key. A metadata.name is a DNS
                  label -- lowercase, no spaces -- and a name people say out loud rarely
                  is, so a plugin that shows "Bingo-Team" reads it from here and not from
                  the object's name.

                  The operator carries it and reads none of it, like Attributes below.
                  Empty is not an error: a plugin then shows the group's own name, and it
                  is the plugin that makes that substitution rather than the operator,
                  so that a picture with the field unset and a picture whose operator
                  predates the field read the same.
                maxLength: 64
                type: string
              drain:
                default:
                  timeoutSeconds: 300
                description: |-
                  Drain bounds how long existing sessions may run out on proxy replacement.

                  Editing it rolls the whole group, and that is worth knowing before an
                  incident rather than during one. The value reaches the pod as
                  terminationGracePeriodSeconds, so it is part of the rendered pod the
                  group's hash covers -- which means raising a drain timeout, the thing an
                  operator does in the middle of an incident, adds a surge pod and a full
                  replacement cycle on top of whatever prompted it.

                  Raising it while a drain is already in flight otherwise behaves: the
                  marked pod keeps its mark, being now stale as well as draining, and the
                  deadline is read from the current spec on every pass. So the edit is
                  safe, just not free.
                properties:
                  timeoutSeconds:
                    description: TimeoutSeconds is the upper bound for the drain.
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - timeoutSeconds
                type: object
              env:
                description: |-
                  Env are extra environment variables for the proxy container, appended
                  to the ones the operator sets. A name may not begin with
                  ReservedEnvPrefix.

                  It is ServerGroupSpec.Env for a proxy, rule and reasoning unchanged,
                  and JAVA_TOOL_OPTIONS is the same seam: the Velocity entrypoint execs
                  java with its own flag list too. It is in podspec.DesiredProxyHash for
                  the same reason -- editing it rolls the group through the ordinary
                  surge-1 path.
                items:
                  description: EnvVar represents an environment variable present in
                    a Container.
                  properties:
                    name:
                      description: |-
                        Name of the environment variable.
                        May consist of any printable ASCII characters except '='.
                      type: string
                    value:
                      description: |-
                        Variable references $(VAR_NAME) are expanded
                        using the previously defined environment variables in the container and
                        any service environment variables. If a variable cannot be resolved,
                        the reference in the input string will be unchanged. Double $$ are reduced
                        to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                        "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                        Escaped references will never be expanded, regardless of whether the variable
                        exists or not.
                        Defaults to "".
                      type: string
                    valueFrom:
                      description: Source for the environment variable's value. Cannot
                        be used if value is not empty.
                      properties:
                        configMapKeyRef:
                          description: Selects a key of a ConfigMap.
                          properties:
                            key:
                              description: The key to select.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the ConfigMap or its key
                                must be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                        fieldRef:
                          description: |-
                            Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                            spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                          properties:
                            apiVersion:
                              description: Version of the schema the FieldPath is
                                written in terms of, defaults to "v1".
                              type: string
                            fieldPath:
                              description: Path of the field to select in the specified
                                API version.
                              type: string
                          required:
                          - fieldPath
                          type: object
                          x-kubernetes-map-type: atomic
                        fileKeyRef:
                          description: |-
                            FileKeyRef selects a key of the env file.
                            Requires the EnvFiles feature gate to be enabled.
                          properties:
                            key:
                              description: |-
                                The key within the env file. An invalid key will prevent the pod from starting.
                                The keys defined within a source may consist of any printable ASCII characters except '='.
                                During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                              type: string
                            optional:
                              default: false
                              description: |-
                                Specify whether the file or its key must be defined. If the file or key
                                does not exist, then the env var is not published.
                                If optional is set to true and the specified key does not exist,
                                the environment variable will not be set in the Pod's containers.

                                If optional is set to false and the specified key does not exist,
                                an error will be returned during Pod creation.
                              type: boolean
                            path:
                              description: |-
                                The path within the volume from which to select the file.
                                Must be relative and may not contain the '..' path or start with '..'.
                              type: string
                            volumeName:
                              description: The name of the volume mount containing
                                the env file.
                              type: string
                          required:
                          - key
                          - path
                          - volumeName
                          type: object
                          x-kubernetes-map-type: atomic
                        resourceFieldRef:
                          description: |-
                            Selects a resource of the container: only resources limits and requests
                            (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                          properties:
                            containerName:
                              description: 'Container name: required for volumes,
                                optional for env vars'
                              type: string
                            divisor:
                              anyOf:
                              - type: integer
                              - type: string
                              description: Specifies the output format of the exposed
                                resources, defaults to "1"
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            resource:
                              description: 'Required: resource to select'
                              type: string
                          required:
                          - resource
                          type: object
                          x-kubernetes-map-type: atomic
                        secretKeyRef:
                          description: Selects a key of a secret in the pod's namespace
                          properties:
                            key:
                              description: The key of the secret to select from.  Must
                                be a valid secret key.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the Secret or its key must
                                be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
                x-kubernetes-validations:
                - message: the SPAWNERY_ prefix is reserved for the environment variables
                    the operator sets itself
                  rule: self.all(e, !e.name.startsWith('SPAWNERY_'))
              expose:
                description: Expose makes the proxies reachable from outside the cluster.
                properties:
                  clusterIP:
                    description: ClusterIP configures type ClusterIP.
                    properties:
                      address:
                        description: |-
                          Address is what a player types.

                          Required, because the operator cannot learn it: it lives in an
                          IngressRouteTCP, an HTTPRoute, a tunnel's configuration or a DNS
                          record — objects under APIs this operator does not read and cannot
                          know are installed. Optional would make "empty" and "forgotten" the
                          same state, which is the gap this strategy exists to close.

                          No port is required and none should usually be given: Minecraft
                          clients default to 25565, so "mc.paul.wtf" is the whole of what a
                          player types. Give "host:port" only when the entry point really is on
                          another port.

                          Nothing checks that it resolves, that anything listens, or that it
                          leads to this group's Service. It is a sign on a door, not a test of
                          the door.
                        minLength: 1
                        type: string
                    required:
                    - address
                    type: object
                    x-kubernetes-validations:
                    - message: 'expose.clusterIP.address is what a player types, not
                        a URL: no scheme and no spaces'
                      rule: '!self.address.contains('' '') && !self.address.contains(''://'')'
                  hostPort:
                    description: "HostPort configures type HostPort.\n\nIt cannot
                      coexist with Pod Security `baseline` or `restricted` in the\nsame
                      namespace: both disallow a container hostPort outright, so the
                      API\nserver refuses every pod of such a group and this operator
                      reports the\nrefusal on Degraded rather than ever admitting
                      one. Measured against\n`restricted` on a real cluster, quoted
                      verbatim:\n\n\tviolates PodSecurity \"restricted:latest\": hostPort\n\t(container
                      \"velocity\" uses hostPort 25577)\n\nThe remedy is a namespace
                      of its own for the HostPort group, with a\nrelaxed Pod Security
                      label, separate from the restricted namespaces the\nrest of
                      the network runs in.\n\nThat namespace is necessary and not
                      sufficient. A hostPort that is\nadmitted, ready and published
                      in status.address can still be\nunreachable, because whether
                      the port is open to the world is a\nhost-firewall question rather
                      than a Kubernetes one -- measured on a\nCilium cluster whose
                      CiliumClusterwideNetworkPolicy admitted a fixed\nlist of ports
                      from `world` and dropped this one, while the pod was\nserving
                      perfectly. docs/network-boundaries.md carries that measurement."
                    properties:
                      port:
                        description: |-
                          Port is bound on every node running a proxy pod. The kube-scheduler
                          keeps at most one such pod per node, so replicas are capped by nodes.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                    required:
                    - port
                    type: object
                  loadBalancer:
                    description: LoadBalancer configures type LoadBalancer.
                    properties:
                      annotations:
                        additionalProperties:
                          type: string
                        description: Annotations are copied onto the Service, e.g.
                          for MetalLB pool selection.
                        type: object
                      externalTrafficPolicy:
                        default: Local
                        description: |-
                          ExternalTrafficPolicy defaults to Local so the client IP survives — bans
                          and rate limits depend on it.
                        type: string
                    type: object
                  nodePort:
                    description: NodePort configures type NodePort.
                    properties:
                      port:
                        description: Port must lie inside the API server's service-node-port-range.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                    required:
                    - port
                    type: object
                  type:
                    description: Type selects the strategy.
                    enum:
                    - LoadBalancer
                    - NodePort
                    - HostPort
                    - ClusterIP
                    type: string
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: expose.nodePort is required for type NodePort
                  rule: self.type != 'NodePort' || has(self.nodePort)
                - message: expose.hostPort is required for type HostPort
                  rule: self.type != 'HostPort' || has(self.hostPort)
                - message: expose.loadBalancer is only allowed for type LoadBalancer
                  rule: self.type == 'LoadBalancer' || !has(self.loadBalancer)
                - message: expose.nodePort is only allowed for type NodePort
                  rule: self.type == 'NodePort' || !has(self.nodePort)
                - message: expose.hostPort is only allowed for type HostPort
                  rule: self.type == 'HostPort' || !has(self.hostPort)
                - message: expose.clusterIP is required for type ClusterIP
                  rule: self.type != 'ClusterIP' || has(self.clusterIP)
                - message: expose.clusterIP is only allowed for type ClusterIP
                  rule: self.type == 'ClusterIP' || !has(self.clusterIP)
              extraPlugins:
                description: |-
                  ExtraPlugins names a volume whose plugins and their configuration are
                  copied into this group's servers on every start. See ExtraPlugins.
                properties:
                  claimName:
                    description: |-
                      ClaimName is a PersistentVolumeClaim in this object's own namespace.

                      It must be ReadWriteMany. A ReadWriteOnce claim mounts on one node, so
                      the second server of a group would sit Pending with a scheduling error
                      naming volume affinity rather than the actual cause; the operator
                      refuses it instead. That refusal also catches a single-replica group,
                      for which ReadWriteOnce would in fact work -- the simpler rule was
                      chosen because maxReplicas can be raised by an edit that has nothing to
                      do with storage, and a group that worked until somebody scaled it is a
                      worse failure than one that never started.
                    minLength: 1
                    type: string
                required:
                - claimName
                type: object
              image:
                description: Image is the Velocity base image. A digest reference
                  is recommended.
                minLength: 1
                type: string
              mounts:
                description: |-
                  Mounts are extra ConfigMap, Secret and PersistentVolumeClaim mounts.

                  It is ServerGroupSpec.Mounts for a proxy and it arrived later, which is
                  worth knowing when reading a manifest written against an older chart: a
                  ProxyGroup simply had no way to be handed a file until then, and the
                  asymmetry was never a decision anybody took. What forced it was one
                  network's own shape -- its proxies read the same shared asset directory
                  its backends do, out of a template that targets both.
                items:
                  description: |-
                    Mount is a single file mount into a managed pod: a ConfigMap, a Secret, or
                    a PersistentVolumeClaim.

                    The claim is what carries the things an image cannot and `extraPlugins` will
                    not: a world tree, a directory of assets every server reads, a pool one
                    group writes and another reads. `extraPlugins` is deliberately narrow -- one
                    claim, read-only, copied into `plugins/` by the entrypoint -- and everything
                    outside `plugins/` needed somewhere to go. docs/mounts.md carries what each
                    of those routes is and the one that is refused.

                    It is still not a layered template system. There is no composition, no
                    priority, no per-server rendering: a mount is one volume at one path, and
                    what assembles the volume's contents is somebody else's job.
                  properties:
                    configMap:
                      description: ConfigMap source.
                      properties:
                        defaultMode:
                          description: |-
                            defaultMode is optional: mode bits used to set permissions on created files by default.
                            Must be an octal value between 0000 and 0777 or a decimal value between 0 and 511.
                            YAML accepts both octal and decimal values, JSON requires decimal values for mode bits.
                            Defaults to 0644.
                            Directories within the path are not affected by this setting.
                            This might be in conflict with other options that affect the file
                            mode, like fsGroup, and the result can be other mode bits set.
                          format: int32
                          type: integer
                        items:
                          description: |-
                            items if unspecified, each key-value pair in the Data field of the referenced
                            ConfigMap will be projected into the volume as a file whose name is the
                            key and content is the value. If specified, the listed keys will be
                            projected into the specified paths, and unlisted keys will not be
                            present. If a key is specified which is not present in the ConfigMap,
                            the volume setup will error unless it is marked optional. Paths must be
                            relative and may not contain the '..' path or start with '..'.
                          items:
                            description: Maps a string key to a path within a volume.
                            properties:
                              key:
                                description: key is the key to project.
                                type: string
                              mode:
                                description: |-
                                  mode is Optional: mode bits used to set permissions on this file.
                                  Must be an octal value between 0000 and 0777 or a decimal value between 0 and 511.
                                  YAML accepts both octal and decimal values, JSON requires decimal values for mode bits.
                                  If not specified, the volume defaultMode will be used.
                                  This might be in conflict with other options that affect the file
                                  mode, like fsGroup, and the result can be other mode bits set.
                                format: int32
                                type: integer
                              path:
                                description: |-
                                  path is the relative path of the file to map the key to.
                                  May not be an absolute path.
                                  May not contain the path element '..'.
                                  May not start with the string '..'.
                                type: string
                            required:
                            - key
                            - path
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                        optional:
                          description: optional specify whether the ConfigMap or its
                            keys must be defined
                          type: boolean
                      type: object
                      x-kubernetes-map-type: atomic
                    mountPath:
                      description: MountPath is the absolute path inside the container.
                      pattern: ^/.*
                      type: string
                    name:
                      description: Name of the volume inside the pod.
                      minLength: 1
                      type: string
                    persistentVolumeClaim:
                      description: PersistentVolumeClaim source. See MountClaim.
                      properties:
                        claimName:
                          description: ClaimName is a PersistentVolumeClaim in this
                            object's own namespace.
                          minLength: 1
                          type: string
                        writable:
                          description: |-
                            Writable mounts the claim read-write. It defaults to false, and the
                            field is spelled this way round -- Writable rather than ReadOnly --
                            so that the zero value is the safe one. An omitted field, a field
                            somebody has not heard of, and a field lost in a hand-written manifest
                            all land on read-only.

                            One group writing a volume that others read is the case this exists
                            for: a generator filling a pool of worlds that game servers consume.
                            Nothing here coordinates that. Two groups that both write the same
                            claim get exactly what two processes writing one filesystem get, and
                            the operator has no way to know which of them meant to.

                            It reaches the pod, so flipping it replaces the group's servers.
                          type: boolean
                      required:
                      - claimName
                      type: object
                    secret:
                      description: Secret source.
                      properties:
                        defaultMode:
                          description: |-
                            defaultMode is Optional: mode bits used to set permissions on created files by default.
                            Must be an octal value between 0000 and 0777 or a decimal value between 0 and 511.
                            YAML accepts both octal and decimal values, JSON requires decimal values
                            for mode bits. Defaults to 0644.
                            Directories within the path are not affected by this setting.
                            This might be in conflict with other options that affect the file
                            mode, like fsGroup, and the result can be other mode bits set.
                          format: int32
                          type: integer
                        items:
                          description: |-
                            items If unspecified, each key-value pair in the Data field of the referenced
                            Secret will be projected into the volume as a file whose name is the
                            key and content is the value. If specified, the listed keys will be
                            projected into the specified paths, and unlisted keys will not be
                            present. If a key is specified which is not present in the Secret,
                            the volume setup will error unless it is marked optional. Paths must be
                            relative and may not contain the '..' path or start with '..'.
                          items:
                            description: Maps a string key to a path within a volume.
                            properties:
                              key:
                                description: key is the key to project.
                                type: string
                              mode:
                                description: |-
                                  mode is Optional: mode bits used to set permissions on this file.
                                  Must be an octal value between 0000 and 0777 or a decimal value between 0 and 511.
                                  YAML accepts both octal and decimal values, JSON requires decimal values for mode bits.
                                  If not specified, the volume defaultMode will be used.
                                  This might be in conflict with other options that affect the file
                                  mode, like fsGroup, and the result can be other mode bits set.
                                format: int32
                                type: integer
                              path:
                                description: |-
                                  path is the relative path of the file to map the key to.
                                  May not be an absolute path.
