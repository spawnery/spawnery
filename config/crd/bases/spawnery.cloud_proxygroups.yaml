                        description: |-
                          ExternalTrafficPolicy defaults to Local so the client IP survives — bans
                          and rate limits depend on it.
                        type: string
                    type: object
                  nodePort:
                    description: NodePort configures type NodePort.
                    properties:
                      port:
                        description: Port must lie inside the API server's service-node-port-range.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                    required:
                    - port
                    type: object
                  type:
                    description: Type selects the strategy.
                    enum:
                    - LoadBalancer
                    - NodePort
                    - HostPort
                    - ClusterIP
                    type: string
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: expose.nodePort is required for type NodePort
                  rule: self.type != 'NodePort' || has(self.nodePort)
                - message: expose.hostPort is required for type HostPort
                  rule: self.type != 'HostPort' || has(self.hostPort)
                - message: expose.loadBalancer is only allowed for type LoadBalancer
                  rule: self.type == 'LoadBalancer' || !has(self.loadBalancer)
                - message: expose.nodePort is only allowed for type NodePort
                  rule: self.type == 'NodePort' || !has(self.nodePort)
                - message: expose.hostPort is only allowed for type HostPort
                  rule: self.type == 'HostPort' || !has(self.hostPort)
                - message: expose.clusterIP is required for type ClusterIP
                  rule: self.type != 'ClusterIP' || has(self.clusterIP)
                - message: expose.clusterIP is only allowed for type ClusterIP
                  rule: self.type == 'ClusterIP' || !has(self.clusterIP)
              extraFiles:
                description: |-
                  ExtraFiles names a volume whose tree is copied into this group's
                  servers on every start, replacing what the server wrote there. See
                  ExtraFiles.
                properties:
                  claimName:
                    description: |-
                      ClaimName is a PersistentVolumeClaim in this object's own namespace.

                      It must be ReadWriteMany: every pod of a group mounts it.
                    minLength: 1
                    type: string
                  image:
                    description: |-
                      Image names an OCI image whose filesystem root is what the claim's root
