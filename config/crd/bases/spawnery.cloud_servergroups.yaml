              phase:
                description: |-
                  Phase says whether players can join: Ready means the group's *floor* is
                  met -- spec.replicas for a persistent group, spec.scaling.minReplicas
                  for an ephemeral one -- not that every server the scaler decided to run
                  is up. Compare readyReplicas against replicas for that, or see the
                  Progressing condition.
                type: string
              pinnedReplicas:
                description: |-
                  PinnedReplicas is the size an Exact ScaleBoost holds this group at,
                  which can be 0. Absent while no pin holds.
                format: int32
                type: integer
              pinnedUntil:
                description: |-
                  PinnedUntil is when that pin ends. Absent without a pin, and for a pin
                  without an end.
                format: date-time
                type: string
              readyReplicas:
                description: ReadyReplicas is the number of servers in phase Ready.
                format: int32
                type: integer
              replicas:
                description: Replicas is the number of Server objects owned by this
                  group.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
