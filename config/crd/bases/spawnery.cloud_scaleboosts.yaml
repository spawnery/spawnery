---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: scaleboosts.spawnery.cloud
spec:
  group: spawnery.cloud
  names:
    kind: ScaleBoost
    listKind: ScaleBoostList
    plural: scaleboosts
    shortNames:
    - boost
    singular: scaleboost
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.groupRef.name
      name: Group
      type: string
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .spec.replicas
      name: Replicas
      type: integer
    - jsonPath: .spec.expiresAt
      name: Expires
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ScaleBoost is extra capacity for a group, for a while.

          It is its own object rather than a field on the group because the operator
          cannot write a ServerGroup's spec, and under GitOps that spec belongs to a
          file anyway.

          It adds to the group's floor and never to its ceiling: spec.scaling.
          maxReplicas still binds. Its effect shows on the group as
          status.boostedReplicas.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ScaleBoostSpec is extra capacity for one group, for a while.
            properties:
              expiresAt:
                description: |-
                  ExpiresAt is when this boost stops counting. A boost without one never
                  expires; the tools that create boosts supply a default.
                format: date-time
                type: string
              groupRef:
                description: GroupRef names the ServerGroup this adds capacity to.
                properties:
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              mode:
                default: Add
                description: |-
                  Mode Add raises the group's floor by Replicas; boosts on one group add
                  up. Mode Exact holds the group at exactly Replicas servers, 0 included:
                  the group's floor and ceiling both become that number, Add boosts stop
                  counting, and of several Exact boosts the newest wins. Neither lifts
                  spec.scaling.maxReplicas.
                enum:
                - Add
                - Exact
                type: string
              replicas:
                description: |-
                  Replicas is how many servers to add (Add, at least 1) or to hold the
                  group at (Exact, at least 0).
                format: int32
                minimum: 0
                type: integer
            required:
            - groupRef
            - replicas
            type: object
            x-kubernetes-validations:
            - message: an Add boost has to add at least one server
              rule: (has(self.mode) && self.mode == 'Exact') || self.replicas >= 1
        type: object
    served: true
    storage: true
    subresources: {}
