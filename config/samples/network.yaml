# A minimal Spawnery network: one lobby group of ephemeral Paper servers and
# one gateway group of Velocity proxies. The servers come up, their agent
# reports in and they reach phase Ready; the ProxyGroup is accepted and gets
# its NodePort Service. The Velocity image itself arrives with milestone 3b —
# until then the proxy pods sit in ImagePullBackOff and no player is routed.
apiVersion: v1
kind: Namespace
metadata:
  name: minecraft
---
apiVersion: v1
kind: Secret
metadata:
  name: velocity-forwarding-secret
  namespace: minecraft
stringData:
  # Replace this before you expose anything: it authenticates the proxy to the
  # backends. Generate one with: head -c 32 /dev/urandom | base64
  secret: change-me
---
apiVersion: spawnery.cloud/v1alpha1
kind: Network
metadata:
  name: production
  namespace: minecraft
spec:
  forwardingSecretRef:
    name: velocity-forwarding-secret
  defaults:
    minecraftVersion: "26.2"
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        memory: 2Gi
---
apiVersion: spawnery.cloud/v1alpha1
kind: ServerGroup
metadata:
  name: lobby
  namespace: minecraft
spec:
  networkRef:
    name: production
  type: Ephemeral
  image: ghcr.io/spawnery/paper:26.2-0.2.0
  maxPlayers: 100
  drain:
    timeoutSeconds: 60
  scaling:
    minReplicas: 1
    maxReplicas: 10
    spareSlots: 40
---
apiVersion: spawnery.cloud/v1alpha1
kind: ProxyGroup
metadata:
  name: gateway
  namespace: minecraft
spec:
  networkRef:
    name: production
  replicas: 1
  # The Velocity image arrives with milestone 3b. Until then this group is
  # accepted, its Service is created and its pods stay in ImagePullBackOff.
  image: ghcr.io/spawnery/velocity:3.4.0-0.2.0
  expose:
    type: NodePort
    nodePort:
      port: 30001
  routing:
    fallbackGroups:
      - lobby
  config:
    playerLimit: 500
    motd: "A Spawnery network"
