# A minimal Spawnery network: one lobby group of ephemeral Paper servers and
# one gateway group of Velocity proxies. The servers come up, their agent
# reports in and they reach phase Ready; the ProxyGroup is accepted, gets its
# NodePort Service, and its pods pull the Velocity image milestone 3b built
# and start the proxy process with online-mode=true and modern forwarding
# configured. What is still missing is milestone 3c's Velocity agent: nothing
# binds the readiness port a proxy pod is probed on (design §6.6), so a proxy
# pod never turns Ready and no player is routed through it yet.
apiVersion: v1
kind: Namespace
metadata:
  name: minecraft
---
apiVersion: v1
kind: Secret
metadata:
  name: velocity-forwarding-secret
  namespace: minecraft
stringData:
  # Replace this before you expose anything: it authenticates the proxy to the
  # backends. Generate one with: head -c 32 /dev/urandom | base64
  secret: change-me
---
apiVersion: spawnery.cloud/v1alpha1
kind: Network
metadata:
  name: production
  namespace: minecraft
spec:
  forwardingSecretRef:
    name: velocity-forwarding-secret
  defaults:
    minecraftVersion: "26.2"
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        memory: 2Gi
---
apiVersion: spawnery.cloud/v1alpha1
kind: ServerGroup
metadata:
  name: lobby
  namespace: minecraft
spec:
  networkRef:
    name: production
  type: Ephemeral
  image: ghcr.io/spawnery/paper:26.2-0.2.0
  maxPlayers: 100
  drain:
    timeoutSeconds: 60
  scaling:
    minReplicas: 1
    maxReplicas: 10
    spareSlots: 40
---
apiVersion: spawnery.cloud/v1alpha1
kind: ProxyGroup
metadata:
  name: gateway
  namespace: minecraft
spec:
  networkRef:
    name: production
  replicas: 1
  image: ghcr.io/spawnery/velocity:3.5.1-0.2.0
  expose:
    type: NodePort
    nodePort:
      port: 30001
  routing:
    fallbackGroups:
      - lobby
  config:
    playerLimit: 500
    motd: "A Spawnery network"
