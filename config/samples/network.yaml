# A minimal Spawnery network: one lobby group of ephemeral Paper servers and
# one gateway group of Velocity proxies. The servers come up, their agent
# reports in and they reach phase Ready; the ProxyGroup is accepted, gets its
# NodePort Service, and its pods pull the Velocity image milestone 3b built
# and start the proxy process with modern forwarding configured. Its agent
# binds the readiness port the pod is probed on (design §6.6) and opens the
# gate on the first server list, so the proxy turns Ready and routes players
# to the lobby group. `online-mode` is the ProxyGroup's own
# spec.config.onlineMode, defaulting true; the backends run with it off, which
# is what the Network's NetworkPolicy exists to bound.
apiVersion: v1
kind: Namespace
metadata:
  name: minecraft
---
apiVersion: v1
kind: Secret
metadata:
  name: velocity-forwarding-secret
  namespace: minecraft
stringData:
  # Replace this before you expose anything: it authenticates the proxy to the
  # backends. Generate one with: head -c 32 /dev/urandom | base64
  secret: change-me
---
apiVersion: spawnery.cloud/v1alpha1
kind: Network
metadata:
  name: production
  namespace: minecraft
spec:
  forwardingSecretRef:
    name: velocity-forwarding-secret
  defaults:
    minecraftVersion: "26.2"
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        memory: 2Gi
---
apiVersion: spawnery.cloud/v1alpha1
kind: ServerGroup
metadata:
  name: lobby
  namespace: minecraft
spec:
  networkRef:
    name: production
  type: Ephemeral
  image: ghcr.io/spawnery/paper:26.2-0.2.1
  maxPlayers: 100
  drain:
    timeoutSeconds: 60
  scaling:
    minReplicas: 1
    maxReplicas: 10
    spareSlots: 40
---
apiVersion: spawnery.cloud/v1alpha1
kind: ProxyGroup
metadata:
  name: gateway
  namespace: minecraft
spec:
  networkRef:
    name: production
  replicas: 1
  image: ghcr.io/spawnery/velocity:3.5.1-0.2.1
  expose:
    type: NodePort
    nodePort:
      port: 30001
    # Alternative: LoadBalancer. Costs a controller this cluster does not
    # ship on bare metal (MetalLB, kube-vip) -- without one, no address is
    # ever assigned and status.address stays empty forever, not merely late.
    # externalTrafficPolicy defaults to Local so the player's real IP
    # survives instead of being replaced by the load balancer's.
    # type: LoadBalancer
    # loadBalancer: {}
    #
    # Alternative: HostPort. Binds the port on every node that runs a proxy
    # pod, so replicas are capped by the node count -- a second pod cannot be
    # scheduled onto a node the first already occupies. It also costs Pod
    # Security: both baseline and restricted disallow a host port outright, so
    # a group in a namespace enforcing either policy never gets a pod, and
    # says so on its own Degraded condition rather than only in the
    # operator's log.
    # type: HostPort
    # hostPort:
    #   port: 25565
    #
    # Alternative: ClusterIP, for a network something else publishes -- an
    # ingress controller with a TCP entry point, a gateway, a tunnel. The
    # operator creates the Service that thing routes to and nothing else, and
    # address is what a player types. It is not checked: nothing here knows
    # whether the name resolves or leads anywhere.
    # type: ClusterIP
    # clusterIP:
    #   address: mc.example.com
  routing:
    fallbackGroups:
      - lobby
  config:
    playerLimit: 500
    motd: "A Spawnery network"
