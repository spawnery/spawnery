# A minimal Spawnery network: one lobby group of ephemeral Paper servers and
# one gateway group of Velocity proxies that routes players to it.
apiVersion: v1
kind: Namespace
metadata:
  name: minecraft
---
apiVersion: v1
kind: Secret
metadata:
  name: velocity-forwarding-secret
  namespace: minecraft
stringData:
  # Replace this before you expose anything: it authenticates the proxy to the
  # backends. Generate one with: head -c 32 /dev/urandom | base64
  secret: change-me
---
apiVersion: spawnery.cloud/v1alpha1
kind: Network
metadata:
  name: production
  namespace: minecraft
spec:
  forwardingSecretRef:
    name: velocity-forwarding-secret
  defaults:
    minecraftVersion: "26.3"
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        memory: 2Gi
---
apiVersion: spawnery.cloud/v1alpha1
kind: ServerGroup
metadata:
  name: lobby
  namespace: minecraft
spec:
  networkRef:
    name: production
  type: Ephemeral
  image: ghcr.io/spawnery/purpur:26.3-0.22.0
  maxPlayers: 100
  drain:
    timeoutSeconds: 60
  scaling:
    minReplicas: 1
    maxReplicas: 10
    spareSlots: 40
---
apiVersion: spawnery.cloud/v1alpha1
kind: ProxyGroup
metadata:
  name: gateway
  namespace: minecraft
spec:
  networkRef:
    name: production
  replicas: 1
  image: ghcr.io/spawnery/velocity:4.2.0-0.22.0
  expose:
    type: NodePort
    nodePort:
      port: 30001
    # Alternative: LoadBalancer. Needs a load-balancer controller (MetalLB,
    # kube-vip) on bare metal, or status.address stays empty forever.
    # externalTrafficPolicy defaults to Local to keep the player's real IP.
    # type: LoadBalancer
    # loadBalancer: {}
    #
    # Alternative: HostPort. One proxy pod per node at most, and Pod Security
    # baseline and restricted both forbid host ports.
    # type: HostPort
    # hostPort:
    #   port: 25565
    #
    # Alternative: ClusterIP, for a network something else publishes (an
    # ingress controller, a gateway, a tunnel). address is what a player types
    # and is not checked.
    # type: ClusterIP
    # clusterIP:
    #   address: mc.example.com
  routing:
    fallbackGroups:
      - lobby
  config:
    playerLimit: 500
    motd: "A Spawnery network"
