apiVersion: v2
name: spawnery
description: A Kubernetes-native control plane for Minecraft server networks
type: application

# The chart's own version, and the operator release it installs by default.
# They move independently: a chart fix that changes no image is a chart
# version bump alone. Since v0.2.14 this number is also the address people
# install by -- `--version` against oci://ghcr.io/spawnery/charts/spawnery --
# so it is no longer only what Flux names a packaged artifact after.
version: 0.2.17
# appVersion beschreibt den Operator, den dieses Chart ausliefert, und nicht die
# Release-Nummer. v0.2.13 aendert nur die Agenten und einen Kommentar an einer
# CRD, v0.2.14 gar kein Image -- sein ganzer Inhalt ist der Veroeffentlichungs-
# weg des Charts selbst --, also stand der Operator dreimal still, waehrend
# version oben sich bewegte.
#
# 0.2.15 zieht beide Zahlen mit: spec.env und eine Claim-Quelle auf spec.mounts
# sind nicht nur CRD-Felder, die Reconciler lesen sie auch (checkMountClaims,
# renderUserMounts), also gibt es diesmal wirklich ein neues Operator-Image.
#
# 0.2.16 ebenso: paper-world-defaults.yml wird ein configOverlay-Schluessel und
# ein Mount unter /data/config wird abgewiesen. Beides ist Code, den der
# Operator ausfuehrt, nicht nur Schema.
#
# 0.2.17 nicht: der Release aendert die Laufzeit der Game-Images und den Agenten,
# am Operator keine Zeile. version oben zieht mit, weil das die Adresse ist,
# unter der installiert wird -- diese Zahl bleibt stehen.
appVersion: "0.2.16"

# The floor is the CRDs', not the operator's. api/v1alpha1 carries
# +kubebuilder:validation:XValidation rules -- five of them on ExposeSpec
# alone -- and CEL validation reaches beta and on-by-default in 1.25.
# Declared rather than measured: nothing in this repository installs the
# chart on an old cluster to find out.
kubeVersion: ">=1.25.0-0"
