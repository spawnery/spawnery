apiVersion: v2
name: spawnery
description: A Kubernetes-native control plane for Minecraft server networks
type: application

# version moves with every change under charts/ (release.yml refuses a tag
# otherwise); it is the address installs and Flux pull by. appVersion is the
# operator release installed by default and moves only with operatorVersion
# in flake.nix, so a chart-only fix bumps version alone.
version: 0.25.0
appVersion: "0.25.0"

# ValidatingAdmissionPolicy (world-deletion policy) is GA from 1.30.
kubeVersion: ">=1.30.0-0"
