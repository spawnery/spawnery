image:
  repository: ghcr.io/spawnery/spawnery-operator
  # A tag, not a digest: hack/publish.sh only learns the digest after the tag
  # is pushed, so a digest written here would always describe the previous
  # release. Pin by digest in the deployment instead.
  tag: "0.19.0"
  # Set, this wins over tag. Left empty deliberately; see above.
  digest: ""
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

# Passed through to the operator pod unchanged.
nodeSelector: {}
tolerations: []
affinity: {}

networkPolicy:
  # The ingress rule in front of the agent endpoint.
  enabled: true

metrics:
  # Both need the Prometheus Operator's CRDs, so both default to off.
  serviceMonitor:
    enabled: false
    # Empty: inherits the release's labels. The label a Prometheus selects on
    # (e.g. `release: <its release>`) belongs to the monitoring installation.
    additionalLabels: {}
    interval: 30s
  prometheusRule:
    enabled: false
    additionalLabels: {}
    # Days of CA lifetime left below which caExpiringSoon fires. Generous
    # because the rotation is a multi-step procedure that waits for a human.
    caExpiryWarningDays: 90
  # A Grafana dashboard as a ConfigMap for Grafana's dashboard sidecar; the
  # labels are the ones the sidecar selects on, annotations can name a folder.
  dashboard:
    enabled: false
    labels:
      grafana_dashboard: "1"
    annotations: {}

operator:
  # hack/e2e.sh overrides this for its own run.
  startupDeadline: 5m
  leaderElect: true
  # Lets a group name a spec.extraPlugins claim, copied into every server's
  # plugins directory on start (docs/guides/plugins-from-a-volume.md).
  #
  # None of the three claim switches is a security control: whoever can write
  # the group can write the claim. They let an installation state as a fact
  # that it runs nothing an administrator dropped in.
  allowPluginVolumes: false

  # Lets a group name a spec.extraFiles claim, copied into every server's
  # working directory on start.
  allowFileVolumes: false

  # Lets a group's spec.mounts name a PersistentVolumeClaim.
  allowMountVolumes: false

# The namespaces that hold a Network, and the forwarding secret in each.
# Renders a Role with resourceNames and a RoleBinding to this release's
# namespace; config/rbac/forwarding-secret-reader.yaml covers namespaces not
# listed here. An entry with no secrets is refused rather than rendered as
# get on every Secret.
#
#   networkNamespaces:
#     - namespace: minecraft
#       secrets:
#         - velocity-forwarding-secret
networkNamespaces: []
