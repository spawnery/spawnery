image:
  repository: ghcr.io/spawnery/spawnery-operator
  # A tag, not a digest: hack/publish.sh only learns the digest after the tag
  # is pushed, so a digest written here would always describe the previous
  # release. Pin by digest in the deployment instead.
  tag: "0.25.1"
  # Set, this wins over tag. Left empty deliberately; see above.
  digest: ""
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

# Passed through to the operator pod unchanged.
nodeSelector: {}
tolerations: []
affinity: {}

networkPolicy:
  # The ingress rule in front of the agent endpoint.
  enabled: true

metrics:
  # Both need the Prometheus Operator's CRDs, so both default to off.
  serviceMonitor:
    enabled: false
    # Empty: inherits the release's labels. The label a Prometheus selects on
    # (e.g. `release: <its release>`) belongs to the monitoring installation.
    additionalLabels: {}
    interval: 30s
  prometheusRule:
    enabled: false
    additionalLabels: {}
    # Days of CA lifetime left below which caExpiringSoon fires. Generous
    # because the rotation is a multi-step procedure that waits for a human.
    caExpiryWarningDays: 90
  # A Grafana dashboard as a ConfigMap for Grafana's dashboard sidecar; the
  # labels are the ones the sidecar selects on, annotations can name a folder.
  dashboard:
    enabled: false
    labels:
      grafana_dashboard: "1"
    annotations: {}

operator:
  # hack/e2e.sh overrides this for its own run.
  startupDeadline: 5m
  leaderElect: true
  # Lets a group name a spec.extraPlugins claim, copied into every server's
  # plugins directory on start (docs/guides/plugins-from-a-volume.md).
  #
  # None of the three claim switches is a security control: whoever can write
  # the group can write the claim. They let an installation state as a fact
  # that it runs nothing an administrator dropped in.
  allowPluginVolumes: false

  # Lets a group name a spec.extraFiles claim, copied into every server's
  # working directory on start.
  allowFileVolumes: false

  # Lets a group's spec.mounts name a PersistentVolumeClaim.
  allowMountVolumes: false

  # Mounts the startup cache published with spawnery's own Purpur images into
  # their servers. Needs the ImageVolume feature on the cluster.
  aotCache: false

# The namespaces that hold a Network, and the forwarding secret in each.
# Renders a Role with resourceNames and a RoleBinding to this release's
# namespace; config/rbac/forwarding-secret-reader.yaml covers namespaces not
# listed here. An entry with no secrets is refused rather than rendered as
# get on every Secret.
#
#   networkNamespaces:
#     - namespace: minecraft
#       secrets:
#         - velocity-forwarding-secret
networkNamespaces: []

# Worlds of groups with spec.storage.backend ObjectStore
# (docs/guides/object-store-worlds.md). Off by default.
worldSync:
  enabled: false
  # Where the node agent DaemonSet runs. It needs privileged pods, so it
  # cannot share a namespace held to the restricted Pod Security level. The
  # chart does not create it. Empty: the release namespace.
  namespace: ""
  image:
    repository: ghcr.io/spawnery/spawnery-worldsync
    # Empty: the chart's appVersion.
    tag: ""
    digest: ""
  registrarImage: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.0
  objectStore:
    endpoint: ""
    region: ""
    bucket: ""
    # A prefix inside the bucket; empty for none.
    prefix: ""
    # A Secret with AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY, in both the
    # release namespace (for deletions) and worldSync.namespace.
    credentialsSecret: ""
  # The node directory for worlds and their snapshots.
  hostPath: /var/lib/spawnery/worldsync
  # How often a running member asks for a snapshot: the most play a node
  # loss costs.
  snapshotInterval: 5m
  nodeSelector: {}
  # Every taint: a game pod scheduled onto a tainted node needs the driver
  # there, or its world volume never mounts.
  tolerations:
    - operator: Exists
  # Keeps the node agent from being evicted ahead of the game pods whose
  # worlds it holds. Empty: none.
  priorityClassName: system-node-critical
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 512Mi
