{{- /*
The operator reads each Network's forwarding secret to detect a rotation, and
its ClusterRole grants no access to Secrets outside its own namespace. This
renders the Role and RoleBinding that authorise it, once per namespace an
administrator names -- and only for those.

Nothing here is rendered by default, and that is deliberate rather than
cautious. Milestone 6d settled that a chart installed once cannot know the game
namespaces a user will create later, so config/rbac/forwarding-secret-reader.yaml
stays a hand-applied file and remains the answer for a namespace nobody listed.
What this adds is the case where somebody *does* know: then the chart can do
what the hand-applied file cannot.

Two things it does that hand-applying cannot:

  - resourceNames. The master design's §8 asks that the secrets grant be
    "restricted through resourceNames to the secrets referenced in networks",
    and the hand-applied file does not carry it -- not because it is wrong but
    because it would cost every administrator an edit per namespace and another
    edit whenever a secret is renamed. Rendered from a value it costs nothing,
    so the narrow form is the easy one here and the broad one is the fallback.

  - The subject's namespace. The hand-applied file hard-codes
    spawnery-system, so an operator installed anywhere else needs it edited
    before it is applied -- which charts/spawnery/README.md carries as an
    installation step. Here the release namespace is known.

What the narrowing is worth is small and worth stating: the operator holds
pods: create cluster-wide, and a pod it creates can mount any Secret in these
namespaces, so a name-scoped get narrows nothing an attacker holding this
ServiceAccount could not walk around. It is defence in depth, not a boundary,
and the design asked for it.
*/ -}}
{{- range .Values.networkNamespaces }}
{{- if not .namespace }}
{{- fail "networkNamespaces: every entry needs a namespace" }}
{{- end }}
{{- if not .secrets }}
{{- /*
Refused rather than rendered wide. An entry with no secrets would render a
Role granting get on every Secret in that namespace, which is the thing this
file exists to avoid, and it would do it silently -- the administrator who
listed the namespace would believe they had narrowed it.
*/ -}}
{{- fail (printf "networkNamespaces: entry for namespace %q lists no secrets; name each Network's forwardingSecretRef, or leave the namespace out and apply config/rbac/forwarding-secret-reader.yaml by hand" .namespace) }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spawnery-forwarding-secret-reader
  namespace: {{ .namespace }}
  labels:
    {{- include "spawnery.labels" $ | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  resourceNames:
  {{- range .secrets }}
  - {{ . }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spawnery-forwarding-secret-reader
  namespace: {{ .namespace }}
  labels:
    {{- include "spawnery.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spawnery-forwarding-secret-reader
subjects:
- kind: ServiceAccount
  name: spawnery-operator
  namespace: {{ $.Release.Namespace }}
{{- end }}
