apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spawnery-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spawnery.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spawnery-operator
subjects:
  - kind: ServiceAccount
    name: spawnery-operator
    namespace: {{ .Release.Namespace }}
