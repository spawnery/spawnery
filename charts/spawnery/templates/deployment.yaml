{{- if and (not .Values.operator.leaderElect) (gt (int .Values.operator.replicas) 1) }}
{{- fail (printf "operator.leaderElect=false needs operator.replicas=1, not %d: without leader election every replica runs the controllers and writes the agent Service's endpoints" (int .Values.operator.replicas)) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spawnery-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spawnery.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicas }}
  strategy:
    {{- if .Values.operator.leaderElect }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- else }}
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      {{- include "spawnery.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "spawnery.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: spawnery-operator
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          # hack/e2e.sh overrides repository, tag and digest: spawnery.image
          # prefers the digest whenever it is set.
          image: {{ include "spawnery.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect={{ .Values.operator.leaderElect }}
            - --allow-plugin-volumes={{ .Values.operator.allowPluginVolumes }}
            - --allow-file-volumes={{ .Values.operator.allowFileVolumes }}
            - --allow-mount-volumes={{ .Values.operator.allowMountVolumes }}
            - --aot-cache={{ .Values.operator.aotCache }}
            - --world-sync={{ .Values.worldSync.enabled }}
            {{- if .Values.worldSync.enabled }}
            - --world-sync-snapshot-interval={{ .Values.worldSync.snapshotInterval }}
            {{- end }}
            - --startup-deadline={{ .Values.operator.startupDeadline }}
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          env:
            # The default for --operator-namespace; the serving certificate's
            # SANs and the agents' dial address derive from it.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_IPS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIPs
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- if .Values.worldSync.enabled }}
            {{- include "spawnery.worldSyncEnv" . | nindent 12 }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
            - name: agent
              containerPort: 9443
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      topologySpreadConstraints:
        {{- if .Values.operator.topologySpreadConstraints }}
        {{- toYaml .Values.operator.topologySpreadConstraints | nindent 8 }}
        {{- else }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "spawnery.selectorLabels" . | nindent 14 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
