apiVersion: apps/v1
kind: Deployment
metadata:
  name: spawnery-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spawnery.labels" . | nindent 4 }}
spec:
  replicas: 1
  # readyz hangs off the leader lock, which the old pod holds until it exits,
  # so a single-replica RollingUpdate would never finish.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "spawnery.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "spawnery.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: spawnery-operator
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          # hack/e2e.sh overrides repository, tag and digest: spawnery.image
          # prefers the digest whenever it is set.
          image: {{ include "spawnery.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect={{ .Values.operator.leaderElect }}
            - --allow-plugin-volumes={{ .Values.operator.allowPluginVolumes }}
            - --allow-file-volumes={{ .Values.operator.allowFileVolumes }}
            - --allow-mount-volumes={{ .Values.operator.allowMountVolumes }}
            - --startup-deadline={{ .Values.operator.startupDeadline }}
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          env:
            # The default for --operator-namespace; the serving certificate's
            # SANs and the agents' dial address derive from it.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
            - name: agent
              containerPort: 9443
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
