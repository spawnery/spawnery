apiVersion: apps/v1
kind: Deployment
metadata:
  name: spawnery-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spawnery.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Replace, do not overlap. Ever since readyz hangs off the leader lock, a new
  # pod only turns ready once it holds that lock — and the old pod holds it for
  # as long as it runs. With a single replica a rolling update waits for
  # exactly that readiness (maxUnavailable 0) before it removes the old pod, so
  # it would sit there until somebody intervenes by hand. Do not switch this
  # back to RollingUpdate.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "spawnery.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "spawnery.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: spawnery-operator
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          # hack/e2e.sh replaces this with the image it just built and
          # loaded into kind, overriding image.repository, image.tag and --
          # since e7877f8 -- image.digest, because spawnery.image prefers the
          # digest whenever it is set and an override on the losing key is no
          # override at all.
          #
          # image.digest here is documentation of the *previous* release, not
          # a pin for this one, and the RKE2 rollout is what established that:
          # hack/publish.sh takes the digest from `skopeo copy --digestfile`,
          # so it cannot be written until after the tag is published, and the
          # commit that writes it back is necessarily behind that tag. A chart
          # installed at tag vX therefore renders the *tag* unless the
          # deployment pins a digest itself -- which is where a digest belongs
          # anyway, and what the master design's §8 is actually asking for:
          # an immutable reference in the manifest a cluster runs.
          # See docs/known-issues.md, "From the RKE2 rollout".
          image: {{ include "spawnery.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect={{ .Values.operator.leaderElect }}
            - --allow-plugin-volumes={{ .Values.operator.allowPluginVolumes }}
            - --allow-file-volumes={{ .Values.operator.allowFileVolumes }}
            - --allow-mount-volumes={{ .Values.operator.allowMountVolumes }}
            # .Values.operator.startupDeadline defaults to the production
            # value (see values.yaml); hack/e2e.sh overrides it with
            # --set operator.startupDeadline=20s for its own run, so there is
            # one occurrence of the flag, set from one value.
            - --startup-deadline={{ .Values.operator.startupDeadline }}
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          env:
            # The default for --operator-namespace. Both the SANs of the
            # serving certificate and the address the agents dial derive
            # from it.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
            - name: agent
              containerPort: 9443
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
