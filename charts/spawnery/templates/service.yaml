apiVersion: v1
kind: Service
metadata:
  name: spawnery-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spawnery.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "spawnery.selectorLabels" . | nindent 4 }}
  ports:
    - name: agent
      port: 9443
      targetPort: agent
      protocol: TCP
