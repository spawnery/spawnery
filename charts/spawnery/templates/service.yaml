apiVersion: v1
kind: Service
metadata:
  name: spawnery-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spawnery.labels" . | nindent 4 }}
spec:
  # No selector: the leader writes this Service's EndpointSlice itself, so
  # that only the leader is an endpoint while every replica is Ready.
  ports:
    - name: agent
      port: 9443
      targetPort: agent
      protocol: TCP
