{{- if .Values.metrics.serviceMonitor.enabled }}
# Off by default: the kind needs the Prometheus Operator's CRDs, and rendering
# it without them fails the install.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: spawnery-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spawnery.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "spawnery.selectorLabels" . | nindent 6 }}
  endpoints:
    # The Service's port name, not the container's.
    - port: metrics
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      # The network metrics carry the network's namespace as `namespace`;
      # without this the Prometheus Operator rewrites it to exported_namespace.
      honorLabels: true
{{- end }}
