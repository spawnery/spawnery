{{- if .Values.networkPolicy.enabled }}
# The per-Network policies are written by the operator into each game
# namespace, which it discovers at runtime. Selecting the operator pod makes it
# default-deny for ingress, hence the second rule for probes and metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spawnery-operator-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spawnery.labels" . | nindent 4 }}
spec:
  # The operator pod does not carry spawnery.cloud/managed-by.
  podSelector:
    matchLabels:
      {{- include "spawnery.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # The agents, from every namespace: the chart cannot know the game
    # namespaces.
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              spawnery.cloud/managed-by: spawnery-operator
      ports:
        - protocol: TCP
          port: 9443
    # Probes and metrics scrape. No `from`: the kubelet's source is the node,
    # no selector names it, and whether policy applies to it is CNI-dependent.
    - ports:
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8080
{{- end }}
