  name: servers.spawnery.cloud
spec:
  group: spawnery.cloud
  names:
    kind: Server
    listKind: ServerList
    plural: servers
    shortNames:
    - mcsrv
    singular: server
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.groupRef.name
      name: Group
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.players
      name: Players
      type: integer
