      name: Registered
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Server is a single running Minecraft server instance.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ServerSpec describes one running Minecraft server instance. It is created
              and owned by a ServerGroup and is not meant to be edited by hand.
            properties:
              groupGeneration:
                description: |-
                  GroupGeneration is the metadata.generation of the group at creation
                  time. A server whose value is behind the group's is stale.
                format: int64
                type: integer
              groupRef:
                description: GroupRef names the owning ServerGroup.
                properties:
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              ordinal:
                description: |-
                  Ordinal is the stable index of a persistent server. Unset for ephemeral
                  servers, whose names carry a random suffix instead.
                format: int32
                minimum: 0
                type: integer
              podHash:
                description: |-
                  PodHash is podspec.DesiredServerHash at the moment this server was
                  created: a digest of everything the operator would render for it. The
                  group compares it against a freshly computed one to decide whether this
                  ordinal is running the current spec.

                  Empty means adopt, never stale. Every server that existed before this
                  field did carries an empty value, and reading that as stale would restart
                  every world in the installation on the first reconcile after an upgrade.
                  The group stamps the current hash onto such a server and orders no
                  takedown.
                type: string
              retire:
                description: |-
                  Retire asks this server to stop taking joins and empty out, without its
                  players being moved. The ServerGroup controller sets it during a rolling
                  update, and -- since the /cloud command -- an administrator can too,
                  through the agent endpoint's retire request rather than by editing this
                  object. It is also the single signal for spec.update.maxUnavailable: a
                  server counts against that budget while this is true, which is what
                  tells a retirement apart from a drain a scale-down or a deletion
                  started.

                  That second writer is why the controller's own retireServer checks the
                  flag before patching: it can now find a server already retiring for a
                  reason it did not cause, and must treat that as done rather than as a
                  state to correct.
                type: boolean
            required:
            - groupRef
            type: object
          status:
            description: ServerStatus is the observed state of a Server.
            properties:
              address:
                description: Address is the pod IP and port the proxies connect to.
                type: string
              conditions:
                description: Conditions follow the standard Kubernetes condition contract.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              drainStartedAt:
                description: |-
                  DrainStartedAt is when the server entered phase Draining. Drives the
                  drain deadline.
                format: date-time
                type: string
              failedAt:
                description: FailedAt is when the server entered phase Failed. Drives
                  the retention.
                format: date-time
                type: string
              phase:
                description: |-
                  Phase is the state machine position: Pending, Starting, Ready, Draining,
                  Terminating or Failed.
                type: string
              players:
                description: Players is the last reported player count, throttled
                  to protect etcd.
                format: int32
                type: integer
              playersUpdatedAt:
                description: |-
                  PlayersUpdatedAt is when Players was last reported by the agent. Counts
                  older than twice the report interval are treated as occupied.
                format: date-time
                type: string
              podName:
                description: |-
                  PodName is the pod backing this server. Set once the pod was created and
                  never reused for a different pod.
                type: string
              readinessLosses:
                description: |-
                  ReadinessLosses counts how often this server fell out of Ready. Past the
                  threshold the server is considered broken rather than flapping.
                format: int32
                type: integer
              readySince:
                description: |-
                  ReadySince is when the server last entered phase Ready. Drives the reset
                  of the readiness-loss counter.
                format: date-time
                type: string
              registered:
                description: Registered reports whether the proxies currently know
                  this server.
                type: boolean
              retiringSince:
                description: |-
                  RetiringSince is when the server entered phase Retiring. It drives
                  spec.update.maxStaleSeconds and nothing else — what marks a server as
                  one this update made unavailable is spec.retire.
                format: date-time
                type: string
              slots:
                description: Slots is the player capacity reported by the agent.
                format: int32
                type: integer
              startedAt:
                description: |-
                  StartedAt is when this server last began trying to become playable: the
                  first pass that accepted it, then the pod creation, and then every entry
                  into phase Starting. It drives the startup deadline, which therefore
                  bounds the current attempt rather than the age of the pod — a long-lived
                  server that loses readiness gets a full deadline to recover in, and is
                  failed if it does not. Do not change this back to pod-creation time.

                  The acceptance stamp is what gives a Server whose pod is never created a
                  clock at all. Written only beside the pod, it left such a Server without
                  one: nothing could fail it, so it sat in Pending occupying its group's
                  slot for as long as whatever refused the pod stood.
                format: date-time
                type: string
              storageResizeError:
                description: |-
                  StorageResizeError names why this server's claim has not grown to
                  spec.storage.size, or is empty when it has (or there is nothing to
                  grow). It covers both shapes a resize can fail in: a patch the API
                  server's own admission refuses synchronously, ordinarily because the
                  claim's storage class sets allowVolumeExpansion: false, and a resize
                  admission accepted that a driver later fails, reported only on the
                  claim itself through its ControllerResizeError or NodeResizeError
                  condition.
                type: string
              storageResizePending:
                description: |-
                  StorageResizePending is true while this server's claim carries the
                  FileSystemResizePending condition: the CSI driver has grown the volume
                  and needs the pod restarted before the filesystem follows. Most drivers
                  expand online and never set it.
                type: boolean
              wasRegistered:
                description: |-
                  WasRegistered is true once this server has been registered with the
                  proxies during the life of its current pod. A server that fell out of
                  Ready is back in Starting but still has its players connected —
                  deregistering stopped new joins, it did not move anyone — so the phase
                  alone cannot tell us whether players are at risk.
                type: boolean
            type: object
        type: object
