{{- if .Values.metrics.prometheusRule.enabled }}
# Off by default for the same reason as the ServiceMonitor beside it.
#
# Every rule alerts on a metric rather than an event or a log line: events
# expire out of the API within the hour.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: spawnery-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spawnery.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: spawnery-ca
      rules:
        # Nothing in the operator watches the CA's ten-year lifetime; rotation
        # only starts when a human annotates the secret.
        - alert: SpawneryCAExpiringSoon
          expr: |
            (spawnery_ca_expiry_timestamp_seconds - time())
              < {{ mul .Values.metrics.prometheusRule.caExpiryWarningDays 86400 }}
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: The spawnery agent CA expires in under {{ .Values.metrics.prometheusRule.caExpiryWarningDays }} days.
            description: >-
              Rotating it is a deliberate multi-step procedure with a hold in
              the middle that waits for a person, so start it with time in
              hand. Annotate the operator's TLS secret with
              spawnery.cloud/rotate-ca=start and follow
              docs/reference/known-issues.md's "On the agent channel" section. Note that
              a start annotation can sit unread for up to an hour on an idle
              cluster, because the operator only re-reads it on its slow tick.

        # Renewal happens at a third of the lifetime left, so this fires only
        # when renewal has stopped working.
        - alert: SpawneryServingCertificateNotRenewing
          expr: (spawnery_serving_cert_expiry_timestamp_seconds - time()) < 86400
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: The spawnery operator's serving certificate expires within a day.
            description: >-
              This certificate renews on its own once a third of its life is
              left, so reaching one day means the renewal path has stopped.
              Every agent handshake fails when it expires.

        # A RotationBlocked event fires only when the blocked list changes.
        - alert: SpawneryCARotationBlocked
          expr: spawnery_ca_rotation_blocked_namespaces > 0
          for: 6h
          labels:
            severity: warning
          annotations:
            summary: A spawnery CA rotation has been waiting on namespaces for six hours.
            description: >-
              Read spawnery.cloud/ca-rotation-blocked-on on the operator's TLS
              secret for the names. A namespace with leftover agent pods and no
              Network blocks the gate by design; the remedy is to delete or
              drain those groups.

        # A rotation that has not reached its own hold within a day is one
        # nobody is driving.
        - alert: SpawneryCARotationStalled
          expr: spawnery_ca_rotation_phase{phase="distributing"} == 1
          for: 24h
          labels:
            severity: warning
          annotations:
            summary: A spawnery CA rotation has been distributing for a day.
            description: >-
              The gate waits for every namespace to show the incoming CA and
              then for a projection margin plus the agent session deadline --
              a quarter of an hour in total, not a day. Check
              spawnery.cloud/ca-rotation-blocked-on, and
              spawnery.cloud/ca-rotation-discarded for a slot the operator
              repaired or threw away.

    - name: spawnery-agents
      rules:
        # A healthy fleet never moves this counter. bound="peer": one pod over
        # MaxConnectionsPerPeer (measured peak 2, bound 8).
        - alert: SpawneryAgentConnectionsRefused
          expr: increase(spawnery_agent_connections_refused_total{bound="peer"}[15m]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: The spawnery operator is refusing agent connections over the per-peer bound.
            description: >-
              One peer address has held MaxConnectionsPerPeer connections open
              and asked for more. Find the peer in the operator's log -- it is
              logged at the first refusal and then at every power of ten, so
              the line is there without the log being the flood. Compare
              spawnery_agent_open_connections against spawnery_agents_expected:
              a fleet at its pod count with one peer refusing is a single
              misbehaving pod, and a fleet well above it is something else.

        # bound="fleet": connections across the endpoint exceed what the pod
        # count explains, so every peer's slack was withdrawn at once.
        - alert: SpawneryAgentFleetOverItsBound
          expr: increase(spawnery_agent_connections_refused_total{bound="fleet"}[15m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: The spawnery agent endpoint holds more connections than its fleet can account for.
            description: >-
              This is the one bound in the agent channel that is a statement
              about the fleet rather than about one peer. Reaching it means
              either that several pods are opening connections they have no use
              for, or that addresses which are not managed pods at all are
              reaching the endpoint -- the NetworkPolicy admits any pod
              labelled spawnery.cloud/managed-by and does not count them. Start
              with the peers in the operator's log and check each against
              `kubectl get pod -A -o wide`. A spawnery_agents_expected of 0
              beside a fleet that plainly is not empty is the third reading:
              the count itself is broken, and the endpoint is serving one
              peer's worth while it is.

    - name: spawnery-permissions
      rules:
        # A watch that lacks its permission retries silently forever, so the
        # log shows nothing. The check runs every ten minutes; for: 5m keeps one
        # scrape between a revocation and the next round from paging.
        - alert: SpawneryOperatorMissingPermissions
          expr: spawnery_permissions_missing > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: The spawnery operator lacks {{ "{{ $value }}" }} permission(s) it needs ({{ "{{ $labels.scope }}" }}).
            description: >-
              The operator's log names each missing verb and the call site that
              needs it -- search it for "is missing permissions it needs". It
              keeps running on purpose, because a missing permission may be one
              this cluster's paths never take, so nothing else will look wrong:
              the paths that need the verb simply reconcile nothing. Compare
              the ClusterRole and Role in the release against
              config/rbac/role.yaml, and check that the bindings still name the
              operator's ServiceAccount.
{{- end }}
