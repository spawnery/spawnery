{{- if .Values.metrics.prometheusRule.enabled }}
# Off by default for the same reason as the ServiceMonitor beside it: the kind
# comes from the Prometheus Operator's CRDs.
#
# The four CA rules are the whole answer to "a CA rotation is asked for, never
# scheduled" and "a RotationBlocked event does not repeat", both in
# docs/known-issues.md. Every one of them alerts on a gauge rather than on an
# event, because a Kubernetes event expires out of the API within the hour and
# the gauges do not. The two agent rules below are the only signal the
# connection bounds produce, and the same argument applies to them: the refusal
# is logged, and a log line is gone from a node long before anyone reads it.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: spawnery-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spawnery.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: spawnery-ca
      rules:
        # The one this file exists for. Nothing in the operator watches the
        # CA's remaining life: CALifetime is ten years, and the rotation
        # procedure runs only because a human annotates the operator's secret.
        # Ten years is not urgent and that is exactly the danger -- it is far
        # enough away that nobody will think of it until something stops
        # handshaking.
        - alert: SpawneryCAExpiringSoon
          expr: |
            (spawnery_ca_expiry_timestamp_seconds - time())
              < {{ mul .Values.metrics.prometheusRule.caExpiryWarningDays 86400 }}
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: The spawnery agent CA expires in under {{ .Values.metrics.prometheusRule.caExpiryWarningDays }} days.
            description: >-
              Rotating it is a deliberate multi-step procedure with a hold in
              the middle that waits for a person, so start it with time in
              hand. Annotate the operator's TLS secret with
              spawnery.cloud/rotate-ca=start and follow
              docs/known-issues.md's "On the agent channel" section. Note that
              a start annotation can sit unread for up to an hour on an idle
              cluster, because the operator only re-reads it on its slow tick.

        # The serving certificate renews itself at a third of its life
        # remaining, so this does not fire on the ordinary path at all. It
        # fires when renewal has stopped working, which nothing else reports.
        - alert: SpawneryServingCertificateNotRenewing
          expr: (spawnery_serving_cert_expiry_timestamp_seconds - time()) < 86400
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: The spawnery operator's serving certificate expires within a day.
            description: >-
              This certificate renews on its own once a third of its life is
              left, so reaching one day means the renewal path has stopped.
              Every agent handshake fails when it expires.

        # docs/known-issues.md: a RotationBlocked event fires only when the
        # list of blocked namespaces changes, and Kubernetes expires it within
        # the hour, so a gate blocked for days is silent everywhere except
        # here and the annotation on the secret.
        - alert: SpawneryCARotationBlocked
          expr: spawnery_ca_rotation_blocked_namespaces > 0
          for: 6h
          labels:
            severity: warning
          annotations:
            summary: A spawnery CA rotation has been waiting on namespaces for six hours.
            description: >-
              Read spawnery.cloud/ca-rotation-blocked-on on the operator's TLS
              secret for the names. A namespace with leftover agent pods and no
              Network blocks the gate by design; the remedy is to delete or
              drain those groups.

        # "Stuck in distributing for two days" is the failure the rotation
        # design most plausibly produces. A rotation that has not reached its
        # own hold within a day is one nobody is driving.
        - alert: SpawneryCARotationStalled
          expr: spawnery_ca_rotation_phase{phase="distributing"} == 1
          for: 24h
          labels:
            severity: warning
          annotations:
            summary: A spawnery CA rotation has been distributing for a day.
            description: >-
              The gate waits for every namespace to show the incoming CA and
              then for a projection margin plus the agent session deadline --
              a quarter of an hour in total, not a day. Check
              spawnery.cloud/ca-rotation-blocked-on, and
              spawnery.cloud/ca-rotation-discarded for a slot the operator
              repaired or threw away.

    - name: spawnery-agents
      rules:
        # A healthy fleet never moves this counter. The bound label separates
        # the two shapes a refusal has, and they are different incidents.
        #
        # bound="peer" is one pod over MaxConnectionsPerPeer, whose measured
        # peak is 2 against a bound of 8 -- see MaxConnectionsPerPeer in
        # internal/agentserver, where that measurement is written down. There
        # are exactly two readings and they need opposite responses, so do not
        # act before telling them apart. Either a pod is opening connections it
        # has no use for, which is the compromise the bound exists for, or the
        # bound has become too low for an agent that legitimately needs more --
        # which can only happen after an agent change, and hack/agent-test.sh
        # is meant to catch that first.
        - alert: SpawneryAgentConnectionsRefused
          expr: increase(spawnery_agent_connections_refused_total{bound="peer"}[15m]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: The spawnery operator is refusing agent connections over the per-peer bound.
            description: >-
              One peer address has held MaxConnectionsPerPeer connections open
              and asked for more. Find the peer in the operator's log -- it is
              logged at the first refusal and then at every power of ten, so
              the line is there without the log being the flood. Compare
              spawnery_agent_open_connections against spawnery_agents_expected:
              a fleet at its pod count with one peer refusing is a single
              misbehaving pod, and a fleet well above it is something else.

        # bound="fleet" is that something else, and it is the more serious of
        # the two: the connections open across the whole endpoint had passed
        # what the operator's own pod count can account for, so it withdrew
        # every peer's slack at once. The peer named in the log may be
        # blameless. A legitimate fleet holds one connection per pod and two
        # through a handover, so anything near four times the pod count is not
        # agents doing their job.
        - alert: SpawneryAgentFleetOverItsBound
          expr: increase(spawnery_agent_connections_refused_total{bound="fleet"}[15m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: The spawnery agent endpoint holds more connections than its fleet can account for.
            description: >-
              This is the one bound in the agent channel that is a statement
              about the fleet rather than about one peer. Reaching it means
              either that several pods are opening connections they have no use
              for, or that addresses which are not managed pods at all are
              reaching the endpoint -- the NetworkPolicy admits any pod
              labelled spawnery.cloud/managed-by and does not count them. Start
              with the peers in the operator's log and check each against
              `kubectl get pod -A -o wide`. A spawnery_agents_expected of 0
              beside a fleet that plainly is not empty is the third reading:
              the count itself is broken, and the endpoint is serving one
              peer's worth while it is.

    - name: spawnery-permissions
      rules:
        # The operator asks the API server every ten minutes whether it still
        # has the permissions it needs, and this is what survives the asking.
        # The reason it is not enough to watch for denials in the log was
        # measured during milestone 6a: a permission reached only through the
        # manager's cache is claimed by a watch, and a watch that cannot start
        # is retried silently forever -- seven and three-quarter minutes with
        # pods:list revoked produced no log line, no 403 in
        # rest_client_requests_total, and no restart. The operator sits there
        # looking healthy and reconciling nothing.
        #
        # Five minutes rather than none: a check runs every ten, so a single
        # scrape landing between a revocation and the next round is not
        # something to page on. Anything that survives one full round is real.
        - alert: SpawneryOperatorMissingPermissions
          expr: spawnery_permissions_missing > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: The spawnery operator lacks {{ "{{ $value }}" }} permission(s) it needs ({{ "{{ $labels.scope }}" }}).
            description: >-
              The operator's log names each missing verb and the call site that
              needs it -- search it for "is missing permissions it needs". It
              keeps running on purpose, because a missing permission may be one
              this cluster's paths never take, so nothing else will look wrong:
              the paths that need the verb simply reconcile nothing. Compare
              the ClusterRole and Role in the release against
              config/rbac/role.yaml, and check that the bindings still name the
              operator's ServiceAccount.
{{- end }}
