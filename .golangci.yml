# The default max-same-issues of 3 shows a sample, not a total. golangci-lint
# caches its results: clear the cache before trusting a count.
version: "2"

run:
  # test/e2e carries //go:build e2e; without the tag it is not linted.
  build-tags:
    - e2e

linters:
  # Named, so a toolchain bump cannot change what "green" means.
  default: none
  enable:
    - errcheck
    - staticcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
