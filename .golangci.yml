# Without this file golangci-lint applies its defaults, and the default
# max-same-issues is 3: at most three findings sharing a message text are
# shown per linter, which can undercount badly on its own. Three consecutive
# runs during milestone 6e's design each reported exactly 17 issues; a
# design-time note claimed each run named a different set of files, but that
# was observed once and did not reproduce -- a reviewer's own three
# consecutive runs later, against the same tree, returned the identical
# seventeen every time. Read the concurrent package walk as a plausible
# cause of a varying subset, not a confirmed one.
#
# What is confirmed: the true figure, from a cleared golangci-lint cache, was
# 38 -- not the 17 a capped run shows, and not the 33 once recorded here,
# which was itself measured against a stale cache (docs/known-issues.md,
# "From milestone 6e"). A check whose output can be a sample rather than a
# total is not a measurement, and CI would have reported an uncertain count
# while nobody could tell whether a falling number meant better code or a
# different sample.
#
# The cache half is worth the same sentence. Those five SA1019 findings in
# internal/controller/setup.go were reported by lint's first CI run and by
# nobody before it: three local runs and two reviewers had all seen `make
# lint` exit 0, every one of them answering from a cache warmed before the
# findings existed, and a hosted runner starts with none. Any tool that caches
# its own answers can report a tree as clean when the cache, not the tree, is
# what is clean -- clear it before trusting a count from it.
version: "2"

run:
  # Without this, the entire test/e2e package is invisible to this linter.
  # Its files carry a //go:build e2e constraint, so `./...` does not resolve
  # them -- `go list ./test/e2e/` answers "build constraints exclude all Go
  # files" -- and the same is true of `go fmt ./...` and `go vet ./...`, which
  # the Makefile's test target depends on. Measured on 2026-08-20: the package
  # was unchecked by all three, and one of its seven files had been
  # unformatted for long enough that nobody could say since when.
  #
  # Turning it on costs nothing: with the tag, errcheck and staticcheck report
  # 0 issues across test/e2e. It was never broken, only unobserved -- which is
  # this repository's own definition of a check that is indistinguishable from
  # an absent one.
  build-tags:
    - e2e

linters:
  # Named rather than inherited, so that a toolchain bump cannot silently
  # change what "green" means here. These two are what the tree was already
  # being held to; adding more is a decision for a later milestone, taken
  # with the count it would introduce.
  default: none
  enable:
    - errcheck
    - staticcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
